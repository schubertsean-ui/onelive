<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Repo-owned fontconfig for visual-regression captures (tools/visual_check.sh).

  WHY THIS EXISTS: the capture Chromium build is byte-identical across machines
  (pinned playwright build 1194), but font RESOLUTION is not: "Georgia" and
  "Space Grotesk" are not installed anywhere we run, so fontconfig substitutes a
  machine-dependent physical font (DejaVu on one box, something else on another),
  and the two desktop feed pages (the only pages with serif display text) diverge
  by over 1% while the detail pages match to 0.000%. Pinning every family the
  app's CSS can request to the Liberation set (present both in this sandbox and
  on the CI runner, where playwright installs it with its system deps) makes
  glyph rasterization deterministic across venues.

  Exported via FONTCONFIG_FILE by visual_check.sh for the capture and audit legs
  only; it never affects the product or any other tooling. visual_check.sh
  fail-closes if this file does not actually resolve Georgia to Liberation Serif
  (an XML syntax error here makes fontconfig silently fall back to system
  defaults, which is exactly the nondeterminism this file exists to remove).

  NOTE: XML comments cannot contain double hyphens; keep prose here free of them.
-->
<fontconfig>
  <!-- Font directories: system install locations (Debian/Ubuntu). -->
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/vischeck-fc-cache</cachedir>

  <!-- App CSS families to deterministic physical fonts. -->
  <match target="pattern">
    <test name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Space Grotesk</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>

  <!-- Generic families to the same deterministic set. -->
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
