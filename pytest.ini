[pytest]
# Collect ONLY OneLive's own suite. Without this, pytest walks
# templates/universal-kernel/ (staged, inert template content — see its
# STAGING_NOTE.md), inserts that directory on sys.path for its self-tests,
# and its `tools/` package then SHADOWS OneLive's `tools/` — every
# `from tools import <onelive_module>` fails at collection. Python 3
# namespace packages make this shadowing happen with or without an
# __init__.py, so ignoring the tree is the correct fix, not deleting a file.
#
# The staged template is verified in its OWN checkout (its 5 kernel-integrity
# tests pass there); it is deliberately NOT part of OneLive's gate surface,
# and nothing in OneLive imports it.
testpaths = tests
norecursedirs = templates .git node_modules web/node_modules
