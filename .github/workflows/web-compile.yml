name: Web Compile

# Production is Next.js. Vercel compiles the full tree on every master
# deploy, including docs-only commits. A path filter here is how #260's
# unclosed fetch() reached production: visual-regression only runs on
# web/**, adversarial tsc only runs when web/ is in the diff, and a
# later docs merge still compiled the broken file.
#
# This job has no path filter. Syntax errors fail every PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: web-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Production build
        working-directory: web
        run: npm run build
