name: experience-metrics

# Measures the part users actually touch — load time, layout stability, blocking
# time and WCAG 2.2 AA — and judges it against the BAR's own numbers.
#
# v1 done-criterion 4 / BAR E1–E4 and P2. `tools/experience_thresholds.py` named
# this workflow in its own docstring while the workflow did not exist — a judge with
# nothing feeding it, which three reviewer lenses on PR #80 called an unwired gate
# surface. Wire it or delete it.
#
# It runs here, not in a session, for the same reason import_licensed does: a runner
# has a browser AND open egress; the sandbox has neither.
#
# THE LOAD BAR IS THE BRIEF'S 2.0 s, not Core Web Vitals' 2.5 s. Widening it is
# founder-crucial. The threshold lives in the tool, tested, not in this file.

on:
  # SECRET CUSTODY — identical rule to site_health.yml, enforced for both by
  # tests/test_workflow_secret_custody.py. This job reads VERCEL_AUTOMATION_BYPASS,
  # and GitHub runs the file from the triggering ref, so EVERY path (dispatch
  # included) is default-branch-only on the job condition below. Measuring an
  # unmerged preview means dispatching from the default branch with its URL.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to measure (no trailing slash)"
        required: true

permissions:
  contents: read

concurrency:
  group: experience-metrics
  cancel-in-progress: true

jobs:
  measure:
    # The guard is on the JOB so no trigger path can miss it — see site_health.yml
    # for the full note on why the dispatch path needs it too. Compared against
    # `github.event.repository.default_branch`, not a literal: a rename must not
    # reopen it, and an absent field fails CLOSED.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      # Required: the judge is a repo file. Omitting checkout ships a step that
      # can never run — the defect tests/test_workflow_checkout_contract.py exists
      # to catch after it happened once here already.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the measuring tools
        # PINNED: a Lighthouse minor can move LCP scoring, and this gate compares a
        # measurement to a FIXED bar — unpinned, a bar met in July silently fails in
        # August with no code change (PR #80).
        run: npm install --no-fund --no-audit -g lighthouse@12.8.2 @axe-core/cli@4.10.2

      - name: Measure and judge against the BAR
        env:
          # Literal-pinned per event (R-054's class): `github.event.inputs.*` is
          # EMPTY on anything but workflow_dispatch.
          BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || github.event.inputs.url }}
          # The literal sentinel ABSENT rather than an empty string, so "no secret"
          # is a value the shell can branch on instead of an ambiguity.
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS || 'ABSENT' }}
        run: |
          set -uo pipefail
          : "${BASE_URL:?target URL missing — failing closed rather than measuring nothing}"
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::url must start with https:// (got '$BASE_URL')"; exit 1 ;;
          esac
          : "${VERCEL_BYPASS:?VERCEL_BYPASS resolved empty — it must be the secret or the literal ABSENT, never blank}"

          # The bypass goes in a QUERY PARAMETER, not a header: lighthouse takes
          # --extra-headers, @axe-core/cli does not, and one form serves both. The
          # consequence, stated rather than discovered later: the secret then
          # appears in Lighthouse's `requestedUrl`, which is why NO artifact is
          # uploaded — the judged table goes to the step summary, measurements only.
          # MEASURE `/tonight`, THE FEED. `/` is a 135-byte redirect stub; the feed
          # is the 6.6 kB page users read. Measuring the base URL would have scored
          # the redirect and reported E1-E4/P2 met with the real feed untested
          # (`CLASS:missing-product-surface-verification`, PR #80) — a gate
          # certifying the wrong page.
          PAGE_PATH="/tonight"
          TARGET="${BASE_URL}${PAGE_PATH}"
          if [ "$VERCEL_BYPASS" != "ABSENT" ]; then
            TARGET="${BASE_URL}${PAGE_PATH}?x-vercel-protection-bypass=${VERCEL_BYPASS}&x-vercel-set-bypass-cookie=true"
            echo "protection_bypass_secret: present"
          else
            echo "protection_bypass_secret: ABSENT — measuring bare; a protection-gated deployment will measure its LOGIN PAGE, not the product"
          fi
          echo "measuring: ${BASE_URL}${PAGE_PATH} (the feed surface, not the redirect stub at /)"

          # PROVE THE TARGET IS THE PRODUCT BEFORE MEASURING IT.
          #
          # Without this the gate could publish a green LCP/CLS/TBT/WCAG verdict
          # over VERCEL'S LOGIN PAGE — which is fast and accessible, and is not the
          # product. Two lenses blocked on it (`CLASS:login-page-metrics-can-pass`,
          # `CLASS:missing-product-render-assertion`, PR #80): the bypass may be
          # ABSENT, or a protection change may start serving an interstitial, and
          # Lighthouse would happily score whatever came back. A gate that certifies
          # the wrong surface is worse than no gate for v1 criterion 4.
          #
          # The masthead is server-rendered in EVERY branch of tonight/page.tsx, so
          # this proves "the feed page rendered", not "the feed had data".
          echo "=== verifying the target renders the product ==="
          PRE_CODE="$(curl -sSL -m 45 -o /tmp/pre.html -w '%{http_code}' "$TARGET" || echo "000")"
          echo "target_http_status: $PRE_CODE"
          if [ "$PRE_CODE" != "200" ]; then
            echo "::error::the measurement target answered $PRE_CODE, not 200 — refusing"
            echo "to report experience metrics for a page that did not serve."
            head -c 300 /tmp/pre.html
            exit 1
          fi
          if ! grep -q "ONE LIVE" /tmp/pre.html; then
            echo "::error::the target returned 200 but did not render the OneLive"
            echo "masthead — this is Vercel's login/protection page or an error shell,"
            echo "not the product. Measuring it would certify the wrong surface."
            if [ "$VERCEL_BYPASS" = "ABSENT" ]; then
              echo "  The bypass secret is ABSENT, which is the most likely cause:"
              echo "  a protection-gated deployment serves its login wall instead."
            fi
            head -c 300 /tmp/pre.html
            exit 1
          fi
          echo "target_surface: RENDERED (OneLive masthead present) — measuring this"

          lighthouse "$TARGET" \
            --quiet --output=json --output-path=/tmp/lh.json \
            --only-categories=performance,accessibility \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage"
          # Its own statement, not a `|| { exit 1; }` tail: workflow_env_lint reads
          # physical lines, so a terminator on a `||` continuation reads as an
          # unconditional exit and later assignments stop crediting (R-073).
          if [ ! -s /tmp/lh.json ]; then
            echo "::error::lighthouse produced no report"
            exit 1
          fi

          # chromedriver is RESOLVED, not assumed: depending on the runner's ambient
          # variable is the empty-env class this repo has hit four times, and
          # workflow_env_lint correctly failed this workflow for consuming it.
          CHROMEDRIVER="$(command -v chromedriver || true)"
          : "${CHROMEDRIVER:?chromedriver not on PATH — cannot run axe, failing closed rather than skipping the accessibility half}"

          axe "$TARGET" \
            --chromedriver-path "$CHROMEDRIVER" \
            --chrome-options="headless,no-sandbox,disable-dev-shm-usage" \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22aa \
            --save /tmp/axe.json \
            || true   # a11y VIOLATIONS make axe exit non-zero; the judge decides,
                      # not the CLI's exit code. A missing/unparseable report is
                      # still caught, because the judge exits 2 on one.
          if [ ! -s /tmp/axe.json ]; then
            echo "::error::axe produced no report — it crashed rather than finding nothing"
            exit 1
          fi

          # $? from a direct invocation, not PIPESTATUS after a `tee`: a pipeline's
          # status is the LAST command's, so piping into tee would replace the
          # judge's verdict with tee's unconditional 0 — a gate demoted to a report.
          STATUS=0
          python3 tools/experience_thresholds.py \
            --lighthouse /tmp/lh.json --axe /tmp/axe.json > /tmp/judged.md 2>&1 \
            || STATUS=$?
          cat /tmp/judged.md

          {
            echo "## Experience metrics — judged against docs/BAR.md E1–E4, P2"
            echo
            echo "Measured on \`${BASE_URL}${PAGE_PATH}\` — the feed surface (bypass: $([ "$VERCEL_BYPASS" != "ABSENT" ] && echo present || echo ABSENT))."
            echo
            cat /tmp/judged.md
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$STATUS"
