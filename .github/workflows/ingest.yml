name: Ingestion Run (manual only — cron deliberately not armed)

# SPRINT Step 5 scaffolding. This workflow runs the real ingestion loop
# (fetch -> sensors -> extract -> gate3 -> candidate store; NEVER promotes —
# promotion is an authenticated human ops action only).
#
# THERE IS NO `schedule:` TRIGGER YET, ON PURPOSE. The charter forbids
# scheduling a recurring loop until ALL of these exist (docs/SPRINT_LIVE_SITE
# .md preconditions; CLAUDE.md Sentinel rule; §14.3 budget caps):
#   1. ANTHROPIC_API_KEY minted with a monthly spend cap set in the console
#      FIRST (founder-crucial), stored as an Actions secret.
#   2. ONELIVE_DB_DSN stored as an Actions secret.
#   3. ORCHESTRATOR_PING_URL (healthchecks.io dead-man check) stored as an
#      Actions secret — a cron that dies silently violates the
#      no-silent-degradation invariant.
#   4. A Friction pre-work attack of the arming plan logged in
#      docs/FRICTION_LOG.md and answered in writing.
# Arming = a follow-up PR that adds the `schedule:` block (hourly cron) and
# deletes this notice; that PR gets the mandatory adversarial review.
#
# Until then, a maintainer can run it manually from the Actions tab; every
# guard below fails LOUD when a precondition is missing.

on:
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Budget ceiling: max sources this run (required; §14.3)"
        required: true
        default: "10"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the budget ceiling input (fail closed, never interpolate)
        env:
          # Untrusted dispatch input reaches the shell ONLY via env (never
          # ${{ }}-interpolated into run: — shell-injection surface) and must
          # be a positive integer; 0/negative is rejected here AND in
          # run_once.py (defense in depth, evaluator finding PR #12 round 1).
          MAX_SOURCES: ${{ github.event.inputs.max_sources }}
        run: |
          # [[ =~ ]] validates the WHOLE string (POSIX ERE, not line-oriented
          # like grep — a newline-smuggled second line cannot pass), and the
          # raw value is never echoed into an annotation (log-command
          # injection surface) — evaluator nits, PR #12 round 2.
          if ! [[ "$MAX_SOURCES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_sources must be a positive integer (invalid value redacted — check the run input). The budget ceiling is required and fails closed; 0 does not mean uncapped."
            exit 1
          fi

      - name: Preconditions (fail loud, never no-op)
        env:
          ONELIVE_DB_DSN: ${{ secrets.ONELIVE_DB_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORCHESTRATOR_PING_URL: ${{ secrets.ORCHESTRATOR_PING_URL }}
        run: |
          missing=""
          [ -z "$ONELIVE_DB_DSN" ] && missing="$missing ONELIVE_DB_DSN"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$ORCHESTRATOR_PING_URL" ] && missing="$missing ORCHESTRATOR_PING_URL"
          if [ -n "$missing" ]; then
            echo "::error::Ingestion refused — missing Actions secret(s):$missing. Minting keys is founder-crucial; the Anthropic key requires a console spend cap FIRST (§14.3). See docs/SPRINT_LIVE_SITE.md Step 5."
            exit 1
          fi

      - name: Assemble the DB DSN (placeholder substitution, fail closed)
        # Founder ergonomics (2026-07-14): Supabase's Connect panel emits the
        # URI with a literal [YOUR-PASSWORD] placeholder, and hand-editing a
        # credential string on a phone is the most error-prone step of setup.
        # Supported paths, both fail-closed:
        #   A (recommended): paste the Supabase URI AS-IS into ONELIVE_DB_DSN
        #     and the database password into ONELIVE_DB_PASSWORD — this step
        #     splices them, URL-ENCODING the password so special characters
        #     can never corrupt the URI (they silently would in a hand-edit).
        #   B: paste a fully-edited DSN (no placeholder); password secret
        #     unused.
        # Placeholder present + no password secret = hard fail, never a
        # half-configured connection attempt.
        env:
          RAW_DSN: ${{ secrets.ONELIVE_DB_DSN }}
          DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os, sys, urllib.parse
          raw = os.environ.get("RAW_DSN", "")
          pw = os.environ.get("DB_PASSWORD", "")
          placeholder = "[YOUR-PASSWORD]"
          if placeholder in raw:
              if not pw.strip():
                  print("::error::ONELIVE_DB_DSN still contains the "
                        "[YOUR-PASSWORD] placeholder and ONELIVE_DB_PASSWORD "
                        "is not set. Recommended: keep the DSN exactly as "
                        "Supabase shows it and add the password as its own "
                        "secret named ONELIVE_DB_PASSWORD.", file=sys.stderr)
                  sys.exit(1)
              final = raw.replace(placeholder, urllib.parse.quote(pw, safe=""))
          else:
              final = raw
          if "\n" in final or "\r" in final:
              print("::error::assembled DSN contains a line break — a copy-"
                    "paste artifact; re-paste the secret as one line.",
                    file=sys.stderr)
              sys.exit(1)
          print(f"::add-mask::{final}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"ONELIVE_DB_DSN={final}\n")
          EOF

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run the loop once (capped, dead-man pinged)
        # ONELIVE_DB_DSN comes from GITHUB_ENV (assembled + masked above),
        # NOT from the raw secret — the assembly step is the single source.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORCHESTRATOR_PING_URL: ${{ secrets.ORCHESTRATOR_PING_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MAX_SOURCES: ${{ github.event.inputs.max_sources }}
        run: |
          python worker/run_once.py --real --max-sources "$MAX_SOURCES"

      - name: Persist the replay log (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-log-${{ github.run_id }}
          path: var/replay/
          # A successful real run MUST leave a replay audit trail — absence on
          # success is a failure. After an earlier failed step, absence is
          # expected and merely warned (the failure is already red).
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
