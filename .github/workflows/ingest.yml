name: Ingestion Run

# SPRINT Step 5. This workflow runs the real ingestion loop
# (fetch -> sensors -> extract -> gate3 -> candidate store; NEVER promotes —
# promotion is an authenticated human ops action only).
#
# ARMED 2026-07-21. Charter preconditions for scheduling a recurring loop
# (CLAUDE.md Sentinel rule; §14.3 budget caps): the spend-capped
# ANTHROPIC_API_KEY, ONELIVE_DB_DSN, and ORCHESTRATOR_PING_URL Actions
# secrets exist, founder-minted (the preconditions step below checks
# PRESENCE and fail-louds if any goes missing — presence is all a workflow
# can check; end-to-end CORRECTNESS is proven by the green pre-merge smoke
# run whose id is recorded in docs/FRICTION_LOG.md entry #3), and the
# Friction pre-work attack of the arming plan is logged and answered in
# that same entry (attacker: the non-Claude CI evaluator on the arming PR
# itself). Dead-man ping: worker/sentinel.py wraps the run in
# start/success/fail pings, and the alarm's configuration is asserted
# MECHANICALLY before every run (PR #43 r11 — prose confirmation was
# correctly rejected for a live cron): the "Assert dead-man period"
# step reads the check's live period/grace through the founder-minted
# READ-ONLY healthchecks API key and fails CLOSED on any mismatch,
# pause, or unreadable state — the loop never runs unwatched. R-020
# tracks this contract; tests/test_ingest_workflow_contract.py derives
# the expected period from the cron line itself, so cadence, declared
# period, and the live check cannot drift apart silently.
#
# Budget shape (§14.3): `schedule` events run with a fixed 10-source
# ceiling (keyed on event_name below — dispatch inputs don't exist on
# schedule events); with least-recently-attempted rotation in
# worker/run_once.py, 10/run x 72 slots/day gives capacity to visit the
# ~230-source catalog ~3x daily instead of starving the tail. Manual
# dispatch still requires an explicit ceiling and FAILS LOUD without one
# — the fixed fallback never applies outside `schedule`.
# AI-SPEND BOUND (R-043): the source ceiling caps PAGES; multi-event fan-out
# makes one extraction call per event block, so the AI-call bound per run is
# max_sources x EXTRACT_MAX_EVENTS_PER_PAGE (worker/ai_extract.py, default 50),
# i.e. <= 500 extraction calls/run at the fixed 10-source schedule ceiling.
# The Anthropic console monthly cap is the hard backstop above both.
#
# INCREMENTAL CRAWL (2026-09-02, founder-directed). Two corrections in one
# session, both worth stating because they change what this workflow's numbers
# MEAN:
#
#   1. "many sources per wave, few pages each" — the class B walk let one
#      source take 15 pages and the run budget was spent IN SOURCE ORDER, so
#      two link-heavy calendars consumed it and everything behind them got
#      zero. The fairness ceiling moved from the RUN to the SOURCE: one door
#      each (ONELIVE_DOORS_PER_SOURCE), at most two fetches per source.
#   2. "K=30 is a spend/time safety cap, not the design" — a tick is no longer
#      "N sources". It is: take what is DUE, most overdue first, and keep going
#      until a REAL budget stops it. How many sources that reached is an
#      OUTCOME, printed after the run, not a number picked in advance.
#
# WHAT STOPS A TICK (worker/crawl_state.py, all declared below, all parsed
# fail-closed BEFORE the first fetch — a typo aborts the run, it never means
# "uncapped"):
#   * ONELIVE_MAX_TICK_SECONDS       wall clock. 600s, half the 20-minute
#                                    cadence, so a long tick never queues
#                                    behind the next one.
#   * ONELIVE_MAX_EXTRACT_CALLS_PER_TICK  the MODEL budget, in pages sent to
#                                    extraction. Extraction is the ONLY stage
#                                    that may call Anthropic, so this is the
#                                    AI spend, bounded directly instead of
#                                    inferred from a source count.
#   * ONELIVE_MAX_FETCHES_PER_TICK   the bug-safety cap, named for what it
#                                    caps. It exists so a loop bug cannot
#                                    fetch forever.
#   * ONELIVE_MAX_FETCHES_PER_HOST   politeness. Past this, further sources on
#                                    that host are DEFERRED to the next tick —
#                                    the tick itself goes on, so one popular
#                                    host cannot cost everybody else a turn.
#
# AI-SPEND BOUND (R-043), restated in the terms that now bind it:
#     ONELIVE_MAX_EXTRACT_CALLS_PER_TICK x EXTRACT_MAX_EVENTS_PER_PAGE
#   = 60 x 50 = 3000 extraction calls per tick — the SAME worst case the old
#     (30 sources + 30 follow-pages) x 50 arithmetic gave. The ceiling has not
#     moved; it is simply expressed as the thing it actually bounds. The
#     Anthropic console monthly cap remains the hard backstop above it.
#
# EXPECTED SPEND GOES DOWN at that unchanged ceiling: the loop sends the
# previous ETag/Last-Modified as conditional-GET headers and compares the
# body's sha256 against the last successful raw_fetch row, so a page that has
# not changed since the last tick costs one cheap GET and ZERO extraction
# calls. Between 20-minute ticks most venue pages have not changed.
#
# THREE QUEUES feed the tick, ordered on their own urgency and never by
# category (the model stays general — ONE-LIVE-VISION.md):
#   EVENT     a published event is approaching a rung of the proximity ladder
#             (T-30d, T-14d, T-7d, T-3d, T-1d, day-of), so its DEFINING page is
#             re-read. One fetch covers every event on that page. These go
#             first — they are the only work with a deadline — but they are
#             capped at a share of the tick so a busy night cannot freeze the
#             rotation.
#   REFRESH   a source whose door we know. One fetch, straight at it.
#   DISCOVER  a source whose door we do not. Start URL + at most one probe.
#
# VERIFICATION IS FAIL-CLOSED. A re-check that cannot confirm OR disconfirm
# changes nothing: no delete, no cancel, no date edit. The loop does not mutate
# published events at all (it writes candidates and stops at the gate); it
# RECORDS a verdict — verified_present / verified_absent / unverified — and
# every failure mode, including one nobody has written yet, is unverified.
#
# max_sources below is kept for exactly what the founder called it: a
# spend/time SAFETY cap, an outer net above the tick budgets. It truncates the
# tail of an already-prioritised plan, so it never cuts the most overdue work.

on:
  schedule:
    # Every 20 minutes (founder-directed 2026-07-21: "accelerate the
    # ingestion to every 15 or 20 minutes" — spend escalation is the
    # founder's own; ~3x hourly-cadence cost, bounded by the source ceiling x
    # the per-page extraction cap (R-043) and the console monthly cap). Minutes chosen off the
    # :00 congestion window where GitHub delays or drops scheduled runs. A
    # missed run is caught by the dead-man check (period 20min + grace),
    # not by log-reading.
    # Minutes shifted 7,27,47 -> 9,29,49 on 2026-07-22 (founder-approved)
    # to prompt scheduler re-registration; cadence unchanged (every 20
    # min). Registration cannot be proven pre-merge (schedules register
    # only from the default branch): the success criterion is the first
    # schedule-event run id (docs/RECORD.md R-008), and continued absence
    # is detected FAIL-CLOSED by the dead-man alarm within period+grace
    # (~30 min) of the last ping. Incident record: R-008 row, 2026-07-22.
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Budget ceiling: max sources this run (required; §14.3)"
        required: true
        default: "10"
      report_flips:
        description: "Set 1 to print the dead-man check's 24h flip history after the assertion (R-023 PATH A probe; read-only, additive)"
        required: false
        default: "0"
      source_class:
        description: "Dispatch-only: run ONLY sources the catalog declares to be this Coverage Law class letter (e.g. B for the public-HTML follow-pages walk). ALL = every enabled source, exactly as the schedule runs."
        required: false
        default: "ALL"
      follow_pages_per_run:
        description: "Dispatch-only override of the run's follow-page budget (blank = the armed default, 30). 0 disables following entirely."
        required: false
        default: ""
      listing_update:
        description: "Dispatch-only: 'armed' (default) lets a CONFIRMED re-check update the published listing; 'dry' caps listing mutations at 0 so the run exercises the whole runtime and changes nothing in the catalog."
        required: false
        default: "armed"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the budget ceiling input (fail closed, never interpolate)
        env:
          # Untrusted dispatch input reaches the shell ONLY via env (never
          # ${{ }}-interpolated into run: — shell-injection surface) and must
          # be a positive integer; 0/negative is rejected here AND in
          # run_once.py (defense in depth, evaluator finding PR #12 round 1).
          # The fixed 10-source ceiling applies to `schedule` events ONLY
          # (keyed on event_name, which callers cannot influence) — every
          # other event type, including manual/API dispatch with a missing
          # or empty input, still FAILS LOUD below. A bare `||` fallback
          # would have silently substituted 10 for any empty dispatch input,
          # weakening the fail-closed budget contract (evaluator finding,
          # PR #43 round 1).
          MAX_SOURCES: ${{ github.event_name == 'schedule' && '30' || github.event.inputs.max_sources }}
        run: |
          : "${MAX_SOURCES:?max_sources input missing — the budget ceiling is required — failing closed}"
          # [[ =~ ]] validates the WHOLE string (POSIX ERE, not line-oriented
          # like grep — a newline-smuggled second line cannot pass), and the
          # raw value is never echoed into an annotation (log-command
          # injection surface) — evaluator nits, PR #12 round 2.
          if ! [[ "$MAX_SOURCES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_sources must be a positive integer (invalid value redacted — check the run input). The budget ceiling is required and fails closed; 0 does not mean uncapped."
            exit 1
          fi

      - name: Preconditions (fail loud, never no-op)
        env:
          ONELIVE_DB_DSN: ${{ secrets.ONELIVE_DB_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORCHESTRATOR_PING_URL: ${{ secrets.ORCHESTRATOR_PING_URL }}
        run: |
          missing=""
          [ -n "$ONELIVE_DB_DSN" ] || missing="$missing ONELIVE_DB_DSN"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$ORCHESTRATOR_PING_URL" ] || missing="$missing ORCHESTRATOR_PING_URL"
          if [ -n "$missing" ]; then
            echo "::error::Ingestion refused — missing Actions secret(s):$missing. Minting keys is founder-crucial; the Anthropic key requires a console spend cap FIRST (§14.3). See docs/SPRINT_LIVE_SITE.md Step 5."
            exit 1
          fi

      - name: Assert dead-man period matches the armed cadence (R-020, fail closed)
        # PR #43 r11: a live recurring cron must not run with its Sentinel
        # alarm config unverified. tools/assert_deadman_period.py (tested)
        # reads the check's LIVE period/grace via the founder-minted
        # READ-ONLY healthchecks API key and refuses the run on mismatch,
        # pause, missing key, unreadable API, or a check the key cannot
        # see — unwatched is not an option. EXPECTED_PERIOD_SECONDS is
        # bound to the cron line above by
        # tests/test_ingest_workflow_contract.py, which recomputes it from
        # the cron minutes — editing one without the other fails the suite.
        env:
          ORCHESTRATOR_PING_URL: ${{ secrets.ORCHESTRATOR_PING_URL }}
          HEALTHCHECKS_API_KEY_RO: ${{ secrets.HEALTHCHECKS_API_KEY_RO }}
          # The dead-man check, DECLARED by name/slug (primary match path —
          # read-only keys don't expose ping URLs and the unique_key hash
          # derivation proved undocumented; declaration beats inference).
          DEADMAN_CHECK_SLUG: "onelive-ingestion"
          EXPECTED_PERIOD_SECONDS: "1200"
          MAX_GRACE_SECONDS: "600"
          # R-023 PATH A probe: dispatch-only, read-only, additive — runs
          # AFTER the assertion passes and only prints the check's flip
          # history (did the alarm actually fire?). Schedule events never
          # set it (callers cannot influence event_name), so the armed
          # cadence's behavior is unchanged.
          REPORT_FLIPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.report_flips || '0' }}
        run: |
          python3 tools/assert_deadman_period.py

      - name: Validate DSN + register log mask (before anything installs)
        # Founder ergonomics (2026-07-14): the Supabase Connect panel emits a
        # URI with a literal [YOUR-PASSWORD] placeholder. tools/assemble_dsn
        # .py (unit-tested) splices in ONELIVE_DB_PASSWORD, URL-encoding it.
        # Defense in depth (evaluator, PR #19 rounds 1-2), BOTH layers:
        #   SCOPE — the assembled credential is exported only inside the run
        #     step below, never via GITHUB_ENV/outputs, so pip install and
        #     other steps never see it;
        #   MASKING — the URL-encoded DSN differs from both GitHub secrets,
        #     so auto-redaction misses it; --mask-command registers a
        #     properly ESCAPED ::add-mask:: ('%'→'%25' first — the escaping
        #     hole was round 1's leak) so even an unforeseen failure path
        #     that prints the environment stays redacted for the whole job.
        # This step also fail-louds on misconfig before deps install.
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          python3 tools/assemble_dsn.py --mask-command

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run the loop once (capped, dead-man pinged)
        # The DB credential exists ONLY inside this step: assembled here via
        # command substitution (never logged — the script prints nothing but
        # the DSN, captured silently) and exported to the worker process
        # alone. No GITHUB_ENV, no step outputs, no add-mask escaping
        # surface.
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORCHESTRATOR_PING_URL: ${{ secrets.ORCHESTRATOR_PING_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # IDENTICAL expression to the validation step (schedule-only fixed
          # ceiling; dispatch stays fail-loud) — both steps must agree or the
          # validated value wouldn't be the executed value.
          MAX_SOURCES: ${{ github.event_name == 'schedule' && '30' || github.event.inputs.max_sources }}
          # THE TICK BUDGETS — what actually stops a tick. Declared here, on
          # the armed cron, so the numbers live where the spend happens. All
          # validated fail-closed before the first fetch.
          ONELIVE_MAX_TICK_SECONDS: "600"
          ONELIVE_MAX_EXTRACT_CALLS_PER_TICK: "60"
          ONELIVE_MAX_FETCHES_PER_TICK: "120"
          ONELIVE_MAX_FETCHES_PER_HOST: "4"
          # The per-SOURCE fairness bound: ONE door, so no venue can spend the
          # tick. The knob is a NEW NAME on purpose — the old
          # ONELIVE_MAX_FOLLOW_PAGES_PER_SOURCE meant "up to 15 discovered
          # pages", and re-pointing that name at "1" would have left any stale
          # copy of it silently restoring the unfair walk. A removed knob
          # cannot do that.
          ONELIVE_DOORS_PER_SOURCE: "1"
          # A blank dispatch input renders as the empty string, which is FALSY
          # in a GitHub expression, so it falls through to the armed default —
          # the same shape MAX_SOURCES above already uses. Both values are
          # therefore ALWAYS non-empty, and an empty one is a real
          # misconfiguration the terminating guards below refuse.
          ONELIVE_MAX_FOLLOW_PAGES_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.follow_pages_per_run || '30' }}
          # Dispatch-only class filter. The "no filter" case has its own
          # explicit value (ALL) rather than an empty string, so "empty" keeps
          # meaning "something went wrong" instead of quietly meaning "run
          # everything" — the schedule sends ALL and is unfiltered, exactly as
          # before this input existed.
          SOURCE_CLASS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_class || 'ALL' }}
          # Dispatch-only kill switch for the listing-update writer
          # (worker/listing_update.py), carried as a WORD and never as the
          # number it stands for. That is deliberate and it is the whole point
          # of this shape: the value this knob exists to deliver is ZERO, and a
          # GitHub expression of the form `A && B || 'default'` decides between
          # its branches by TRUTHINESS. Whether the string '0' is truthy there
          # is a question whose wrong answer silently arms a writer on a run
          # somebody asked to be dry — so no numeric string passes through an
          # expression at all. 'armed' and 'dry' are both non-empty, so the
          # fallback is unambiguous, and the shell below maps the word to the
          # budget. Blank or schedule => armed, exactly as before this input.
          LISTING_UPDATE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.listing_update || 'armed' }}
        run: |
          : "${MAX_SOURCES:?max_sources input missing — the budget ceiling is required — failing closed}"
          : "${ONELIVE_MAX_FOLLOW_PAGES_PER_RUN:?follow-page budget rendered empty — the ceiling is required — failing closed}"
          : "${SOURCE_CLASS:?source_class rendered empty — expected a Coverage Law letter or ALL — failing closed}"
          : "${LISTING_UPDATE_MODE:?listing-update mode rendered empty — expected armed or dry — failing closed}"
          # armed deliberately sets NOTHING: the budget then comes from
          # MAX_LISTING_MUTATIONS_PER_TICK in worker/crawl_state.py, so the
          # number has ONE home and this workflow cannot drift from it. Only
          # the dry case names a value, and 0 means "none of this" by the
          # project-wide budget rule (resolve_int_env), never "uncapped".
          case "$LISTING_UPDATE_MODE" in
            dry)
              ONELIVE_MAX_LISTING_MUTATIONS_PER_TICK=0
              export ONELIVE_MAX_LISTING_MUTATIONS_PER_TICK
              echo "listing-update writer DISABLED for this run (dry): no published row can be updated or marked, whatever any page says."
              ;;
            armed)
              echo "listing-update writer ARMED (code default): a CONFIRMED re-check may update the listing it defines."
              ;;
            *)
              echo "::error::unknown listing_update mode '$LISTING_UPDATE_MODE' — expected armed or dry — failing closed"
              exit 1
              ;;
          esac
          # The class letter is untrusted dispatch input: it reaches the
          # process through env only, never interpolated into this shell text
          # (a workflow expression written here would be a script-injection
          # surface AND, inside a run block, GitHub parses it as one even in a
          # comment), and run_once.py rejects anything that is not a Coverage
          # Law class letter.
          CLASS_ARGS=()
          if [ "$SOURCE_CLASS" != "ALL" ]; then
            CLASS_ARGS=(--source-class "$SOURCE_CLASS")
          fi
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python worker/run_once.py --real --max-sources "$MAX_SOURCES" "${CLASS_ARGS[@]}"

      - name: Persist the replay log (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-log-${{ github.run_id }}
          path: var/replay/
          # A successful real run MUST leave a replay audit trail — absence on
          # success is a failure. After an earlier failed step, absence is
          # expected and merely warned (the failure is already red).
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
