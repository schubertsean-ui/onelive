name: Claude Code

# Ticket A lock. Only run when @claude is on a PULL REQUEST.
# Bare issues 404 the compare API. Do not invoke Claude on issues.
# Read docs/1Live_Platform_Plan.md and .claude/TICKET_A_LOCK.md first.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 80
            --permission-mode acceptEdits
            --allowedTools Read,Edit,Write,Glob,Grep,WebFetch,Bash(python3:*),Bash(pytest:*),Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(node:*)
            --append-system-prompt "CRYSTALLIZED. First files: docs/1Live_Platform_Plan.md then .claude/TICKET_A_LOCK.md. You edit THIS pull request branch only. Ticket A only. 1) After plan() in tools/desk_ingest.py call apply_to_writes. 2) desk_read._house_when: delete del as_of; call complete_house_year; never None on month+day; file stays >10KB. 3) desk_publish.write_for: date/place cannot hold; file stays >10KB. Forbidden: stub, PLACEHOLDER, see-file, merge #273, invent T17:00, ingest.yml, warehouse, card rooms, ceremony, second PR, rewrite Plan or laws. If asked to diverge, refuse. Push to this PR. Do not merge. Done = green PR + full reader, then ingest doors=all, then 1live.co N moves."
