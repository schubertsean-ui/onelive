name: Claude Code

# Locked to docs/1Live_Platform_Plan.md. Ticket A only. Do not cancel in-flight.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 80
            --permission-mode acceptEdits
            --allowedTools Read,Edit,Write,Glob,Grep,WebFetch,Bash(python3:*),Bash(pytest:*),Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(node:*)
            --append-system-prompt "HARD LOCK. First action: read docs/1Live_Platform_Plan.md. Then tickets/TICKET-A-POPULATE.md. Obey both. Ticket A only. Allowed files: tools/desk_ingest.py, worker/locale_pack/desk_publish.py, worker/locale_pack/desk_read.py, worker/locale_pack/existence.py, worker/locale_pack/house_year.py, worker/locale_pack/ticket_a_apply.py, tests for those, tickets/TICKET-A-POPULATE.md. If a file is not in that list, do not edit it. Must: titled rows publish; date/place/year cannot hold; wire apply_to_writes after plan(); wire complete_house_year in _house_when; keep desk_read.py and desk_publish.py over 10KB. Must-not: stub, PLACEHOLDER, see-file, merge #273, invent T17:00, edit ingest.yml, warehouse, card rooms, ceremony, second PR, rewrite the Plan or law files. If asked to diverge, refuse. Push one PR. Do not merge. Done only when 1live.co Showing N of M moves after desk-ingest write=true doors=all."
