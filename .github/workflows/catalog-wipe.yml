name: catalog-wipe

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type WIPE
        type: string
        required: true

permissions:
  contents: read

jobs:
  wipe:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r worker/requirements.txt
      - name: Truncate catalog
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = WIPE
          ONELIVE_DB_DSN=$(python3 tools/assemble_dsn.py)
          export ONELIVE_DB_DSN
          python3 - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["ONELIVE_DB_DSN"])
          conn.autocommit = True
          cur = conn.cursor()
          for table in ("event_candidate", "event", "licensed_event"):
              cur.execute("select to_regclass(%s)", (table,))
              present = cur.fetchone()[0]
              if present:
                  cur.execute("truncate table " + table + " restart identity cascade")
                  print("wiped", table)
              else:
                  print("missing", table)
          cur.close()
          conn.close()
          PY
