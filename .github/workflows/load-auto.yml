name: load-auto
on:
  push:
    paths:
      - .github/workflows/load-auto.yml
  workflow_dispatch:
jobs:
  ingest:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: desk-ingest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: Walk all doors and write
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing}"
          : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python3 tools/desk_ingest.py --real --city Austin --hours 168 --max-pages 80 --write | tee desk-ingest-report.md
      - name: Report
        if: always()
        run: |
          echo "### load-auto" >> "$GITHUB_STEP_SUMMARY"
          test -f desk-ingest-report.md && cat desk-ingest-report.md >> "$GITHUB_STEP_SUMMARY" || true
