name: Extraction Golden-Set Exam (release-blocking)

# KAIZEN §M7 / R-013: no extraction change ships without golden-set exam
# evidence. Design v2 (founder-directed 2026-07-15 — environment
# "required reviewers" is org-plan-only and unavailable on this personal
# repo): this PR-triggered job carries NO SECRETS AT ALL. The secret-
# bearing exam runs only in extraction-exam-dispatch.yml, which can only
# be fired manually by a maintainer (workflow_dispatch = the attended-
# human property). This job is the release gate's other half: it goes
# green ONLY when a successful attended run exists for this PR's exact
# head SHA and its report artifact proves the pass was (a) real, (b) for
# the PRODUCTION-ROUTED model, and (c) against this PR's exact prompt
# (content hash). Push a new commit and the evidence expires with the SHA
# — a maintainer must dispatch the exam again on the new head.
#
# Property preserved from the r7/r8 reviews: PR-controlled code is never
# run with the Anthropic key by any automatic/unattended trigger.

on:
  pull_request:
    paths:
      - "ai/**"
      - "worker/ai_models.py"
      - "worker/ai_extract.py"
      - "tools/model_router.py"          # the ratification flag + routing table live here
      - ".github/workflows/extraction-eval.yml"
      - ".github/workflows/extraction-exam-dispatch.yml"

concurrency:
  group: extraction-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-exam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read      # to find the attended run + download its report artifact
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the PR HEAD SHA (not the synthetic merge ref): the
          # routed-model and prompt-hash expectations below must come from
          # exactly the commit the evidence certifies.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps (structural lint imports the runner)
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Verify attended exam evidence for this exact head SHA (fail closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # 1. A SUCCESSFUL attended (workflow_dispatch) run on this exact SHA.
          RUN_ID="$(api "https://api.github.com/repos/$REPO/actions/workflows/extraction-exam-dispatch.yml/runs?event=workflow_dispatch&status=success&head_sha=$HEAD_SHA" | python3 -c "import json,sys; runs=json.load(sys.stdin).get('workflow_runs') or []; print(runs[0]['id'] if runs else '')")"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful ATTENDED exam run exists for head SHA $HEAD_SHA. A maintainer must dispatch 'Extraction Golden-Set Exam — attended run' on this branch (Actions tab -> that workflow -> Run workflow), then re-run this check. No attended evidence means no pass (fail closed)."
            exit 1
          fi
          echo "found attended run $RUN_ID for $HEAD_SHA"
          # 2. Download its exam-report artifact.
          ART_URL="$(api "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts" | python3 -c "import json,sys; arts=json.load(sys.stdin).get('artifacts') or []; hits=[a for a in arts if a['name'].startswith('golden-exam-report-')]; print(hits[0]['archive_download_url'] if hits else '')")"
          if [ -z "$ART_URL" ]; then
            echo "::error::Attended run $RUN_ID has no exam-report artifact — evidence that cannot be read is not evidence (fail closed)."
            exit 1
          fi
          api -L -o report.zip "$ART_URL"
          python3 -c "import zipfile; zipfile.ZipFile('report.zip').extractall('.')"
          # 3. The report must show a PASS, for the PRODUCTION-ROUTED model
          #    (the dispatch input can name any model — evidence for a
          #    different model certifies nothing), against THIS PR's exact
          #    prompt (content hash — same-SHA pinning makes this redundant
          #    by construction; kept as cheap defense in depth).
          python3 tools/verify_exam_evidence.py exam-report.json

      - name: Golden-set structural lint (no key needed — runs on every PR)
        run: |
          python -m pytest tests/test_golden_exam.py -q -k "structural or injection_and_trap or shingles or surface_forms"
