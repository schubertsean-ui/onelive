          insert = '''    dates = _house_dates(text, page_html, as_of)
    return dates[0] if len(dates) == 1 else None


def _house_dates(card_text: str, page_html: str,
                 as_of: Optional[_date]) -> List[str]:
    """Every calendar night THIS CARD printed, year completed from the page.

    One weekday+month+day hit is one night. Two hits are two nights.
    We do not pick, and we do not store None to avoid choosing.
    Named weekdays plus Continues through Month Day fill each matching
    weekday from as_of through that end date, inclusive.
    """
    text = (card_text or "").strip()
    if not text:
        return []
    years = _years_in_date_context(text, page_html)
    if not years and as_of is not None:
        years = {as_of.year}
    if not years:
        from datetime import date as _today
        years = {_today.today().year}
    year = sorted(years)[-1]
    out: List[str] = []
    seen = set()
    for hit in _HOUSE_WD_MD_RE.finditer(text):
        wd, mon, day_s = hit.groups()
        month = _HOUSE_MONTHS[mon.lower()]
        day = int(day_s)
        weekday = _HOUSE_WEEKDAYS[wd[:3].lower()]
        try:
            candidate = _date(year, month, day)
        except ValueError:
            continue
        if candidate.weekday() != weekday:
            continue
        iso = candidate.isoformat()
        if iso not in seen:
            seen.add(iso)
            out.append(iso)
    through = _HOUSE_THROUGH_RE.search(text)
    if through and as_of is not None:
        tmon, tday_s = through.groups()
        try:
            end = _date(year, _HOUSE_MONTHS[tmon.lower()], int(tday_s))
        except ValueError:
            end = None
        named = { _HOUSE_WEEKDAYS[w[:3].lower()] for w in _HOUSE_WD_ONLY_RE.findall(text) }
        if end is not None and named:
            cur = as_of
            if hasattr(cur, "date"):
                cur = cur.date()
            while cur <= end:
                if cur.weekday() in named:
                    iso = cur.isoformat()
                    if iso not in seen:
                        seen.add(iso)
                        out.append(iso)
                cur = cur.fromordinal(cur.toordinal() + 1)
    return out

    hits = list(_HOUSE_WD_MD_RE.finditer(text))
    if len(hits) != 1:
        return None
    wd, mon, day_s = hits[0].groups()'''
