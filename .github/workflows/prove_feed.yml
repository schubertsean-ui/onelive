name: prove-feed
# Read-only proof for the founder: print a diverse sample of REAL events straight
# from the live Supabase, across many cultural domains. No secrets (uses the
# public publishable key). Manual only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      # NO `uses:` STEPS, DELIBERATELY. On 2026-08-06 four consecutive runs of
      # this workflow died in "Getting action download info" with
      # "Failed to resolve action download info. Error: Service Unavailable" —
      # a GitHub marketplace-resolution outage. The repo was never downloaded
      # and not one line of lab code ran. Every script this job calls is
      # stdlib-only, so actions/setup-python bought nothing, and the checkout
      # action is replaceable by the git that is already on the runner.
      # Removing both removes the whole dependency on that failing service:
      # this job now needs only git, bash and the runner's own Python.
      - name: Fetch the repository without the actions registry
        env:
          # Passed through env, never interpolated into the script body: a
          # missing value would otherwise render as an empty string and the
          # clone would silently target the wrong URL (workflow_env_lint).
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?github.token is empty — refusing to clone}"
          : "${REPO:?github.repository is empty — refusing to clone}"
          test -z "$(ls -A .)" || { echo "workspace is not empty"; exit 1; }
          # The credential goes in an auth HEADER, not in the remote URL, so it
          # cannot be echoed back by a git error message or land in the remote.
          git clone --depth 1 --quiet --branch "$GITHUB_REF_NAME" \
            -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            "https://github.com/${REPO}" .
          git config --unset-all http.extraheader || true
          git log --oneline -1
      # Pin the interpreter the way setup-python did, but fail LOUD instead of
      # silently drifting if a future runner image moves off 3.12.
      - name: Confirm the runner's Python is the version this job expects
        run: |
          set -euo pipefail
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Print a diverse live sample of real events
        run: python3 tools/sample_feed.py
      # LAB: THE DENOMINATOR — count distinct dated events across the
      # aggregators that already inventory this market (alt-weekly, city
      # guides, ticketing, radio, TV, periodicals, library). Every other
      # number this project reports is a numerator; without this one, "1,633
      # published" cannot be turned into a coverage fraction. A source we
      # cannot read reports BLOCKED and contributes UNKNOWN, never 0 — an
      # unreadable aggregator counted as empty would deflate the denominator
      # and flatter our own coverage. No credential, no model call.
      - name: Denominator census across market aggregators (lab)
        run: python3 lab/denominator.py --json lab_denominator.json
