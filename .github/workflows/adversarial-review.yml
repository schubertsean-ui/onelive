name: Adversarial Review (non-Claude)

# CLAUDE.md §0.2 / Agent org: the generator (Claude) never grades its own
# trust-critical work. This gate posts the PR's raw diff + test log to the
# Independent Evaluator (OpenAI, default gpt-5.5) via tools/adversarial_review
# .py and FAILS unless it answers "VERDICT: APPROVE". --require makes a
# missing OPENAI_API_KEY a hard failure here (in CI the review is MANDATORY;
# the local tool merely skips loud). Paths below are the charter's
# trust-critical classes: auth, pipeline, SQL/RLS, data-trust, prompt/model,
# and the harness that enforces them.
#
# workflow_dispatch exists so a maintainer can run the evaluator against an
# arbitrary ref/range from the Actions tab (e.g. re-attacking a plan diff or
# reviewing an already-merged commit) — the key lives only in Actions secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "api/**"
      - "worker/**"
      - "ai/**"
      - "supabase/**"
      - "tools/**"
      - "web/middleware.ts"
      - "web/lib/allowlist.ts"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      range:
        description: "git diff range to review (e.g. master...HEAD or <sha>^1..<sha>)"
        required: true
        default: "origin/master...HEAD"

concurrency:
  group: adversarial-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so merge-base diffs (base...head) resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker + api deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt -r api/requirements.txt pytest

      - name: Test suite (log captured for the evaluator)
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Extract the diff under review
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git diff "${{ github.event.inputs.range }}" > pr.diff
          else
            git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          fi
          wc -c pr.diff

      - name: Independent evaluator (APPROVE required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional repo variable to pin a different reviewer model.
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
        run: |
          python tools/adversarial_review.py --require \
            --diff-file pr.diff --test-log pytest.log
