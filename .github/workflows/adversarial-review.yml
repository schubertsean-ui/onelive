name: Adversarial Review (non-Claude)

# CLAUDE.md §0.2 / Agent org: the generator (Claude) never grades its own
# trust-critical work. This gate posts the PR's raw diff + test logs to the
# Independent Evaluator (OpenAI, default gpt-5.5) via tools/adversarial_review
# .py and FAILS unless it answers "VERDICT: APPROVE".
#
# Runs on EVERY pull request — no path filter. The evaluator itself judged a
# path filter bypassable (PR #11 rounds 1-2): trust rules live in CLAUDE.md /
# docs/** as much as in code, and "mandatory" must not depend on where a file
# sits. Relationship to the other gates (cross-linked per PR #11 round 2):
# trust-gate.yml runs the deterministic invariants + pytest + eval-harness
# import on every PR/push; `bash tools/validate` is the local end-of-shift
# everything gate. This workflow is the independent non-Claude REVIEW leg —
# it complements, never replaces, those.
#
# Security posture (from this gate's own evaluator reviews):
# - The evaluator script executes ONLY from the TRUSTED BASE REF, with
#   `python -I` (stdlib-only; immune to PYTHONPATH/cwd hijack). If the script
#   is absent on the base ref (bootstrap: the PR introducing the tool), the
#   gate HARD-FAILS WITHOUT the secret ever entering the job — a warning is
#   not enforcement. That bootstrap PR is human-reviewed and merged with this
#   check red, once; afterwards the gate is self-consistent.
# - Machine-generated lockfiles are excluded from the diff by policy (noted
#   to the evaluator); --require refuses truncated diffs outright.
# - Supply-chain gate: production deps must audit clean at high/critical
#   (`npm audit --omit=dev --audit-level=high` blocks); the full audit is
#   shown to the evaluator; accepted exceptions live in docs/SCA_BASELINE.md.
# - checkout uses persist-credentials: false; OPENAI_API_KEY is exposed only
#   to the final trusted-script step.
#
# workflow_dispatch reviews an arbitrary ref/range from the Actions tab
# (e.g. re-attacking a plan diff or reviewing an already-merged commit).
#
# ATTENDED REVIEW WITH EXAM EVIDENCE (PR #31 reviews r2-r3, PR #32
# review r5; TODOS P1): the reviewer reads only diff + attached logs, so
# bound attended-exam evidence — which lives in the base-owned release
# gate's verifier output — is structurally invisible on pull_request
# runs, and MUST stay that way: anything a pull_request-triggered job
# assembles is assembled by the PR's own workflow copy and is therefore
# forgeable-by-construction (r5 blocker — "checks out nothing" does not
# make the workflow definition trusted). The evidence-attached review
# therefore exists ONLY in workflow_dispatch mode: GitHub always
# executes the DEFAULT BRANCH's copy of a dispatched workflow, so no PR
# can influence how the evidence is fetched or attached. Dispatch with
# exam_head_sha set (and range=master...<that head>) after the attended
# exam passes; the attended-review job fails loud on ANY anomaly —
# missing evidence in attended mode is an error, never a shrug.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      range:
        description: "git diff range to review (e.g. master...HEAD or <sha>^1..<sha>)"
        required: true
        default: "origin/master...HEAD"
      exam_head_sha:
        description: "Optional: 40-hex head SHA whose bound golden-exam release-gate output should be fetched and attached as review evidence (attended mode)"
        required: false
        default: ""

concurrency:
  group: adversarial-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-review:
    # Skipped in attended mode — the attended-review job below is the
    # evidence-bearing variant and runs instead.
    if: ${{ github.event_name == 'pull_request' || inputs.exam_head_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so merge-base diffs (base...head) resolve.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the base ref and diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "base=origin/master" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.event.inputs.range }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the TRUSTED evaluator script from the base ref (or hard-fail)
        run: |
          mkdir -p /tmp/trusted
          if git show "${{ steps.range.outputs.base }}:tools/adversarial_review.py" \
               > /tmp/trusted/adversarial_review.py 2>/dev/null; then
            echo "Using tools/adversarial_review.py from ${{ steps.range.outputs.base }} (trusted)."
          else
            echo "::error::BOOTSTRAP HARD-FAIL: tools/adversarial_review.py does not exist on ${{ steps.range.outputs.base }}. Running a PR-supplied reviewer with the API secret would let any PR self-approve or exfiltrate the key, so this gate refuses. The PR that introduces the tool must be HUMAN-reviewed and merged with this check red — the gate becomes enforceable the moment the tool lands on the base branch."
            exit 1
          fi

      - name: Install worker + api deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt -r api/requirements.txt pytest

      - name: Test suite (log captured for the evaluator)
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Web checks + SCA when web/ is touched (log captured for the evaluator)
        run: |
          set -o pipefail
          if git diff --name-only "${{ steps.range.outputs.range }}" | grep -q '^web/'; then
            (
              cd web
              npm ci
              # Supply-chain gate: production deps clean at high/critical, or
              # the job fails here. Full audit (incl. dev/moderate) is shown to
              # the evaluator below; reviewed exceptions: docs/SCA_BASELINE.md.
              npm audit --omit=dev --audit-level=high
              npm audit || true
              npx tsc --noEmit
              npm test
              # Publishable keys are non-secret client identifiers; this dummy
              # (base64 of clerk.example.com) only satisfies the /ops prerender
              # so `next build` can complete in CI without real Clerk config.
              NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS5jb20k npm run build
            ) 2>&1 | tee web.log
          else
            echo "no web/ files in this diff — web checks not applicable" | tee web.log
          fi

      - name: Extract the diff under review (lockfiles excluded by policy)
        run: |
          {
            echo "# NOTE to evaluator: machine-generated lockfiles (package-lock.json)"
            echo "# are excluded from this diff by policy — they are npm-generated and"
            echo "# validated by 'npm ci' + the blocking npm-audit SCA gate in the"
            echo "# attached web log instead (exceptions: docs/SCA_BASELINE.md)."
            echo "# NOTE to evaluator: golden-set exam evidence for extraction-surface"
            echo "# changes is NOT in these logs, and the model call + Anthropic secret"
            echo "# do NOT live in the release check. They live in a SEPARATE manual,"
            echo "# maintainer-dispatched, default-branch workflow"
            echo "# (.github/workflows/extraction-exam-dispatch.yml) that runs the real"
            echo "# routed model and uploads exam-report.json as an artifact. The"
            echo "# release-blocking check (.github/workflows/extraction-eval.yml) is a"
            echo "# SECRETLESS verifier on pull_request_target (base-owned trigger): it"
            echo "# checks out base+subject data only and confirms a SUCCESSFUL attended"
            echo "# exam run exists for this PR's head SHA. Merge discipline requires BOTH"
            echo "# this review and that verifier green on the PR's current head; absence"
            echo "# of exam output here is expected and is not absence of the gate."
            git diff "${{ steps.range.outputs.range }}" -- . ':(exclude)**/package-lock.json'
          } > pr.diff
          wc -c pr.diff

      - name: Independent evaluator (APPROVE required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # NO runtime model override in CI — deliberately (evaluator finding,
          # PR #14 round 4): GitHub renders an UNSET repo variable and a
          # SET-BUT-EMPTY one identically in ${{ vars.* }}, so a workflow can
          # never fail closed on the difference. Instead of adding an API
          # existence-check to a trust-critical path, the channel is removed:
          # CI always runs the trusted script's DEFAULT_MODEL, and changing
          # the reviewer model is a PR editing that constant — reviewed by the
          # OLD model via the trusted-base-ref mechanism, exactly how a
          # write/grade-separation change should land. (If the default model
          # is ever dead/deprecated, that PR merges with this check red under
          # the documented human-review bootstrap exception above.) The
          # OPENAI_REVIEW_MODEL env override still exists for LOCAL runs,
          # where the script itself fails loud on empty or Claude-family ids.
        run: |
          python -I /tmp/trusted/adversarial_review.py --require \
            --diff-file pr.diff --test-log pytest.log --test-log web.log

  # ATTENDED review with exam evidence — dispatch-only, therefore always
  # the DEFAULT BRANCH's copy of this workflow: no PR can influence how
  # evidence is fetched, filtered, or attached (r5 blocker). This job
  # runs ONLY trusted default-branch code (the dispatch checkout IS
  # master), so the expanded read scopes coexist with no PR code. The
  # shared steps below are byte-identical mirrors of the pull_request
  # job's (drift is caught mechanically by
  # tests/test_adversarial_review.py::test_attended_job_mirrors_review_job).
  attended-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.exam_head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read      # list extraction-eval.yml runs + read the gate job's log
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so merge-base diffs (base...head) resolve.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the base ref and diff range
        id: range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXAM_HEAD: ${{ inputs.exam_head_sha }}
        run: |
          set -euo pipefail
          # The attended range is DERIVED from exam_head_sha (r6 blocker):
          # the reviewed diff and the fetched evidence are bound to the
          # same commit by construction — the free-form range input is
          # deliberately IGNORED in attended mode, so no dispatch mistake
          # or mischief can pair evidence for commit A with a diff of
          # commit B. (The web-check and diff steps consume this derived
          # range too — r6 nit — because they read steps.range outputs.)
          if ! [[ "$EXAM_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::exam_head_sha must be a full 40-hex lowercase commit SHA (got '$EXAM_HEAD')."
            exit 1
          fi
          # The head under review lives on a PR branch the default
          # checkout may not have — single authenticated fetch of exactly
          # that commit (same pattern as extraction-exam-dispatch.yml).
          AUTH_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_B64" \
            fetch --no-tags origin "$EXAM_HEAD"
          echo "base=origin/master" >> "$GITHUB_OUTPUT"
          echo "range=origin/master...$EXAM_HEAD" >> "$GITHUB_OUTPUT"

      - name: Pin the TRUSTED evaluator script from the base ref (or hard-fail)
        run: |
          mkdir -p /tmp/trusted
          if git show "${{ steps.range.outputs.base }}:tools/adversarial_review.py" \
               > /tmp/trusted/adversarial_review.py 2>/dev/null; then
            echo "Using tools/adversarial_review.py from ${{ steps.range.outputs.base }} (trusted)."
          else
            echo "::error::BOOTSTRAP HARD-FAIL: tools/adversarial_review.py does not exist on ${{ steps.range.outputs.base }}. Running a PR-supplied reviewer with the API secret would let any PR self-approve or exfiltrate the key, so this gate refuses. The PR that introduces the tool must be HUMAN-reviewed and merged with this check red — the gate becomes enforceable the moment the tool lands on the base branch."
            exit 1
          fi

      - name: Install worker + api deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt -r api/requirements.txt pytest

      - name: Test suite (log captured for the evaluator)
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      # DOCUMENTED DIVERGENCE from the pull_request job (r7 blocker):
      # this checkout is MASTER, so running npm ci/tsc/test/build here
      # would validate BASE web code while attaching the log as if it
      # validated the PR — misattributed evidence. Attended mode reviews
      # extraction-surface flips (data-only diffs); a range touching
      # web/ is out of its scope and REFUSES rather than misattributes.
      - name: Web checks + SCA when web/ is touched (log captured for the evaluator)
        run: |
          set -euo pipefail
          if git diff --name-only "${{ steps.range.outputs.range }}" | grep -q '^web/'; then
            echo "::error::attended evidence review covers extraction-surface flips only; this range touches web/ — web validation must come from the normal pull_request review, which builds the PR's own web tree. Refusing to attach logs that would misattribute base web checks to the PR."
            exit 1
          fi
          echo "no web/ files in this range — web checks not applicable (attended mode reviews extraction-surface flips; a web-touching range fails this job)" | tee web.log

      - name: Fetch the bound release-gate output for exam_head_sha (fail loud on ANY anomaly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXAM_HEAD: ${{ inputs.exam_head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # tee, not a bare redirect (r6 blocker): the fail() reasons must
          # be visible in the Actions step log itself, not only inside an
          # artifact nobody opens; pipefail preserves the exit code.
          python3 - <<'PY' 2>&1 | tee exam-evidence.log
          import json, os, re, sys, urllib.error, urllib.request

          # Pinned API version: shape assumptions target a dated contract.
          HEADERS = {"Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}

          def _get(url):
              h = dict(HEADERS)
              h["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              with urllib.request.urlopen(
                      urllib.request.Request(url, headers=h), timeout=30) as r:
                  return r.read()

          def fail(msg):
              print(f"EVIDENCE FETCH FAILED: {msg}")
              print("Attended mode asserts bound evidence exists; any anomaly is "
                    "an error. This job exits 1 (fail loud).")
              sys.exit(1)

          def jfield(payload, key):
              # A missing/null/mis-typed field is response-shape drift and
              # fails loud — never coerced to "no results".
              v = payload.get(key)
              if not isinstance(v, list):
                  fail(f"API field {key!r} missing or not a list — "
                       f"response-shape drift")
              return v

          def paged(url_base, key):
              # Fail-closed bound. Why 300 is safe: re-running a gate run
              # creates a new ATTEMPT of the same run id, not a new run —
              # new runs for one head only accrue from distinct trigger
              # deliveries for that exact commit, realistically tens at
              # the outside. Three FULL pages of 100 therefore signals
              # something anomalous; refuse rather than pick from a
              # possibly truncated view.
              out = []
              for page in (1, 2, 3):
                  batch = jfield(json.loads(_get(
                      f"{url_base}&per_page=100&page={page}")), key)
                  out.extend(batch)
                  if len(batch) < 100:
                      break
              else:
                  fail(f"more than 300 {key} for one head — listing may be "
                       f"truncated")
              return out

          head = os.environ.get("EXAM_HEAD", "")
          repo = os.environ["REPO"]
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              fail(f"exam_head_sha {head!r} is not a full 40-hex NORMALIZED "
                   f"LOWERCASE commit SHA (uppercase hex must be lowercased)")
          print(f"# Release-gate (extraction-eval.yml) output for head {head},")
          print("# fetched by the DEFAULT-BRANCH copy of this workflow")
          print("# (workflow_dispatch — no PR can influence this code path).")
          print("# ENFORCEMENT remains the gate itself; this is review input.")
          # head_sha semantics PROVEN, not assumed (r7 finding checked
          # empirically 2026-07-17): pull_request_target runs of
          # extraction-eval.yml report head_sha == the PR HEAD, not the
          # base-side SHA — verified against live runs 29582525541 /
          # 29581978914 / 29581805115, whose head_sha values equal PR
          # #31's successive heads exactly. This filter therefore finds
          # the gate runs for the examined head.
          try:
              runs = paged(
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  f"extraction-eval.yml/runs?head_sha={head}"
                  f"&event=pull_request_target&status=completed",
                  "workflow_runs")
          except SystemExit:
              raise
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  fail("extraction-eval.yml is not a registered workflow — "
                       "the release gate itself is missing")
              fail(f"HTTP {e.code} listing extraction-eval.yml runs")
          except Exception as e:
              fail(f"{type(e).__name__}: {e} while listing runs")
          if not runs:
              fail("no completed pull_request_target run of "
                   "extraction-eval.yml exists for this head — in attended "
                   "mode absent evidence is an error, not a shrug")
          # Audit trail (r6 nit): every candidate, then the selection.
          for r in runs:
              print(f"candidate run={r.get('id')} "
                    f"attempt={r.get('run_attempt')} "
                    f"conclusion={r.get('conclusion')} "
                    f"started={r.get('run_started_at')}")
          # Only a SUCCESSFUL verifier run is evidence (r6 blocker): a
          # failed/cancelled/timed-out gate run proves nothing attachable.
          runs = [r for r in runs if r.get("conclusion") == "success"]
          if not runs:
              fail("release-gate runs exist for this head but NONE concluded "
                   "success — a failed verifier run is not evidence")
          runs.sort(key=lambda r: (r.get("run_started_at")
                                   or r.get("created_at") or "",
                                   r.get("run_attempt") or 0))
          run = runs[-1]
          print(f"workflow={run.get('path')} run={run['id']} "
                f"attempt={run.get('run_attempt')} event={run.get('event')} "
                f"conclusion={run.get('conclusion')} url={run.get('html_url')}")
          try:
              jobs = paged(
                  f"https://api.github.com/repos/{repo}/actions/runs/"
                  f"{run['id']}/jobs?filter=latest", "jobs")
              job = next((j for j in jobs if j.get("name") == "golden-exam"),
                         None)
              if job is None:
                  fail("no job named 'golden-exam' in that run — the "
                       "verifier workflow's shape changed; the evidence "
                       "contract is broken")
              if job.get("conclusion") != "success":
                  # r6 blocker: enforce at the JOB level too — a run can
                  # succeed while an individual job was skipped/cancelled.
                  fail(f"golden-exam job conclusion is "
                       f"{job.get('conclusion')!r}, not 'success' — not "
                       f"attachable evidence")
              print(f"job={job['id']} conclusion={job.get('conclusion')} "
                    f"url={job.get('html_url')}")
              log = _get(f"https://api.github.com/repos/{repo}/actions/jobs/"
                         f"{job['id']}/logs").decode("utf-8", "replace")
          except SystemExit:
              raise
          except urllib.error.HTTPError as e:
              fail(f"HTTP {e.code} fetching the gate job/log")
          except Exception as e:
              fail(f"{type(e).__name__}: {e} fetching the gate job/log")
          # Verdict-aware, case-insensitive; truncation is REPORTED and
          # keeps both ends so final verdict lines always survive.
          lines = log.splitlines()
          markers = ("exam evidence", "::error::", "golden_lint",
                     "surface diff", "expect_", "evidence", "rejected",
                     "accepted", "verdict")
          decisive = [l for l in lines if any(m in l.lower() for m in markers)]
          if len(decisive) > 200:
              omitted = len(decisive) - 200
              decisive = (decisive[:100]
                          + [f"... TRUNCATED: {omitted} marker lines omitted "
                             f"(first 100 and last 100 kept) ..."]
                          + decisive[-100:])
          print("--- decision-bearing lines ---")
          print("\n".join(decisive))
          tail = lines[-40:]
          print(f"--- last {len(tail)} lines (context) ---")
          print("\n".join(tail))
          PY
          wc -c exam-evidence.log

      - name: Extract the diff under review (lockfiles excluded by policy)
        run: |
          {
            echo "# NOTE to evaluator: machine-generated lockfiles (package-lock.json)"
            echo "# are excluded from this diff by policy — they are npm-generated and"
            echo "# validated by 'npm ci' + the blocking npm-audit SCA gate in the"
            echo "# attached web log instead (exceptions: docs/SCA_BASELINE.md)."
            echo "# NOTE to evaluator: golden-set exam evidence for extraction-surface"
            echo "# changes is NOT in these logs, and the model call + Anthropic secret"
            echo "# do NOT live in the release check. They live in a SEPARATE manual,"
            echo "# maintainer-dispatched, default-branch workflow"
            echo "# (.github/workflows/extraction-exam-dispatch.yml) that runs the real"
            echo "# routed model and uploads exam-report.json as an artifact. The"
            echo "# release-blocking check (.github/workflows/extraction-eval.yml) is a"
            echo "# SECRETLESS verifier on pull_request_target (base-owned trigger): it"
            echo "# checks out base+subject data only and confirms a SUCCESSFUL attended"
            echo "# exam run exists for this PR's head SHA. Merge discipline requires BOTH"
            echo "# this review and that verifier green on the PR's current head; absence"
            echo "# of exam output here is expected and is not absence of the gate."
            git diff "${{ steps.range.outputs.range }}" -- . ':(exclude)**/package-lock.json'
          } > pr.diff
          wc -c pr.diff

      - name: Independent evaluator (APPROVE required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # NO runtime model override in CI — deliberately (evaluator finding,
          # PR #14 round 4): GitHub renders an UNSET repo variable and a
          # SET-BUT-EMPTY one identically in ${{ vars.* }}, so a workflow can
          # never fail closed on the difference. Instead of adding an API
          # existence-check to a trust-critical path, the channel is removed:
          # CI always runs the trusted script's DEFAULT_MODEL, and changing
          # the reviewer model is a PR editing that constant — reviewed by the
          # OLD model via the trusted-base-ref mechanism, exactly how a
          # write/grade-separation change should land. (If the default model
          # is ever dead/deprecated, that PR merges with this check red under
          # the documented human-review bootstrap exception above.) The
          # OPENAI_REVIEW_MODEL env override still exists for LOCAL runs,
          # where the script itself fails loud on empty or Claude-family ids.
        run: |
          python -I /tmp/trusted/adversarial_review.py --require \
            --diff-file pr.diff --test-log pytest.log --test-log web.log \
            --test-log exam-evidence.log
