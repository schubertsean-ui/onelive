name: Weekly Dependency Hygiene

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

concurrency:
  group: dependency-hygiene
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Sentinel (charter: no scheduled loop without a dedicated dead-man).
      # Weekly cron — the dead-man also catches GitHub auto-disabling crons
      # after repo inactivity, which no failure email ever reports.
      - name: Dead-man period assertion (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          ORCHESTRATOR_PING_URL: ${{ secrets.DEPENDENCY_HYGIENE_PING_URL }}
          HEALTHCHECKS_API_KEY_RO: ${{ secrets.HEALTHCHECKS_API_KEY_RO }}
          DEADMAN_CHECK_SLUG: "onelive-dependency-hygiene"
          EXPECTED_PERIOD_SECONDS: "604800"
          MAX_GRACE_SECONDS: "86400"
        run: |
          python3 tools/assert_deadman_period.py
      - name: Dead-man START ping (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          PING_URL: ${{ secrets.DEPENDENCY_HYGIENE_PING_URL }}
        run: |
          [ -n "$PING_URL" ] || exit 0
          curl -fsS -m 10 --retry 3 "$PING_URL/start" || true
      # Model resolved via the cost-routing policy (docs/MODEL_ROUTING.md),
      # never hardcoded — dependency triage is a Standard-tier task. The
      # substitution runs in its own assignment (not inside echo) so a router
      # failure fails THIS STEP under `bash -e`, never becoming `model=`.
      - name: Resolve model (cost routing)
        id: route
        run: |
          model="$(python3 tools/model_router.py standard)"
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ steps.route.outputs.model }}
          max_turns: 10
          allowed_tools: "git,gh pr"
          prompt: |
            Check for outdated npm/pip dependencies with known security advisories.
            Update STATE.md's "known dependency" notes if anything material changed.
            Open a PR for any safe, non-breaking version bumps. Do not touch pinned
            versions (next@14.2.5, react@18.3.1, expo@~51.0.0) without flagging why in the PR body.

      - name: Dead-man SUCCESS ping (scheduled runs only)
        if: ${{ github.event_name == 'schedule' && success() }}
        env:
          PING_URL: ${{ secrets.DEPENDENCY_HYGIENE_PING_URL }}
        run: |
          [ -n "$PING_URL" ] || exit 0
          curl -fsS -m 10 --retry 3 "$PING_URL" || true
      - name: Dead-man FAIL ping (scheduled runs only)
        if: ${{ github.event_name == 'schedule' && failure() }}
        env:
          PING_URL: ${{ secrets.DEPENDENCY_HYGIENE_PING_URL }}
        run: |
          [ -n "$PING_URL" ] || exit 0
          curl -fsS -m 10 --retry 3 "$PING_URL/fail" || true
