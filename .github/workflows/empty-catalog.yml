name: empty-catalog
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/empty-catalog.yml"
      - "tools/catalog_wipe.py"
jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: Empty event tables
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing}"
          : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python3 tools/catalog_wipe.py
