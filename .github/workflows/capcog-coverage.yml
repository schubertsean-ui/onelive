name: CAPCOG Coverage

# THE launch metric: what share of CAPCOG venues do we actually cover?
#
# Founder-directed 2026-07-26 — "If you haven't already created the 'total
# potential number of venues in CAPCOG' list and are comparing your data
# ingestion to that, you don't know what you're testing against."
#
# The dev sandbox has no outbound network, so the denominator fetch (TABC) runs
# HERE, where the importers already run. Manual dispatch on purpose: this is a
# measurement, not a gate, and it should be run when someone wants the number —
# not on every push, burning Actions minutes for an answer nobody is reading.

on:
  workflow_dispatch:
    inputs:
      skip_tabc:
        description: "Skip the TABC fetch and measure against the catalog layer only"
        required: false
        default: "false"
  # Re-measure whenever the denominator's own logic changes. Two reasons, and
  # the second is the one that matters day to day:
  #
  #  1. A change to the boundary, the target builder or the fetchers changes
  #     what the number MEANS. Re-running by hand is a step nobody takes, and a
  #     coverage figure that silently describes an older definition is worse
  #     than no figure.
  #  2. The dev sandbox has no egress to data.texas.gov, so TABC — the layer
  #     that turns a 39-venue curated floor into the actual market universe —
  #     can ONLY be fetched here. Waiting for a merge to learn the real venue
  #     count made the measurement hostage to the review queue.
  #
  # Path-scoped, so ordinary commits do not spend Actions minutes on it.
  push:
    paths:
      - "tools/fetch_tabc_capcog.py"
      - "tools/build_capcog_targets.py"
      - "tools/capcog_coverage.py"
      - "worker/region/capcog.py"
      - "sources/master_sources_catalog_120.json"
      # CONSUMED, not a script: `pip install -r` here, so a
      # dependency bump changes what the measurement computes with.
      - "worker/requirements.txt"
      - ".github/workflows/capcog-coverage.yml"

permissions:
  contents: read
  # Read-only, and only to fetch the PREVIOUS run's artifact so the scorecard
  # trend survives the ephemeral runner. Deliberately not `contents: write`:
  # persisting the history by committing it back would give a workflow write
  # access to the repository, which is a posture change, not a metrics chore.
  actions: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -q -r worker/requirements.txt

      # Layer 2. Fails LOUD on a schema change or a bad response rather than
      # yielding zero rows — "CAPCOG has no venues" would be a lie, not a result.
      # Print the dataset's real columns BEFORE the fetch that depends on them.
      # The sandbox has no egress to data.texas.gov, so the schema is only
      # observable from here; when the fetch fails on a column name, this step
      # has already answered why in the same run instead of costing another.
      - name: Describe the TABC dataset schema
        if: ${{ github.event.inputs.skip_tabc != 'true' }}
        continue-on-error: true
        run: python tools/fetch_tabc_capcog.py --describe

      - name: Fetch TABC licensed premises (denominator layer 2)
        if: ${{ github.event.inputs.skip_tabc != 'true' }}
        run: python tools/fetch_tabc_capcog.py


      - name: Build the venue target list
        run: |
          if [ -f sources/tabc_capcog_raw.json ]; then
            python tools/build_capcog_targets.py --tabc sources/tabc_capcog_raw.json
          else
            python tools/build_capcog_targets.py
          fi

      # Report the DENOMINATOR before anything that can fail on a missing
      # secret. The venue universe is the question "how much of CAPCOG is
      # there to cover?", and it does not depend on the database at all — but
      # it used to sit behind a step that hard-fails without ONELIVE_DB_DSN, so
      # a missing secret cost us the half of the answer that was already
      # computed.
      - name: Denominator — the CAPCOG venue universe
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path(
              "sources/capcog_venue_targets.json").read_text())
          print("## CAPCOG venue universe (the denominator)")
          print()
          print(f"**{d['venue_target_count']} venues** across "
                f"{len(d['counts_added_per_layer'])} layer(s): "
                f"{d['counts_added_per_layer']}")
          print()
          print("| county | venues |")
          print("|---|---|")
          for county, n in d["per_county"].items():
              print(f"| {county} | {n} |")
          print()
          print(f"Not counted as venues (kept, listed, not divided by): "
                f"{d['by_target_kind']}")
          if not d["is_complete_universe"]:
              print()
              print("> FLOOR, not the complete universe — layers present: "
                    f"{', '.join(d['layers_present'])}")
          PY

      # DATABASE STEPS RUN ON MANUAL DISPATCH ONLY.
      #
      # Adding a `push` trigger put the database credential on a path that runs
      # SUBJECT-CONTROLLED code: every script below is editable by the same PR
      # that triggers the run, so a malicious change would execute with live DB
      # access on push. That was not possible before I added the trigger, and
      # convenience is not a reason to widen what a secret is exposed to.
      #
      # The split costs nothing real: the DENOMINATOR — the part that changed
      # today, and the part that needs a fast loop — touches no database and
      # still runs on every push. The numerator is a measurement someone asks
      # for, so requiring a human dispatch is the right shape anyway.
      # REF-BOUND, not just trigger-bound. `workflow_dispatch` alone still lets
      # a dispatch be aimed at ANY ref, so the credential's custody rested on a
      # human choosing a safe branch — a live database credential must fail
      # closed by construction. Evaluator finding, PR #84 r1.
      - name: Read ingested venues from the database
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        env:
          ONELIVE_DB_DSN: ${{ secrets.ONELIVE_DB_DSN }}
        run: |
          : "${ONELIVE_DB_DSN:?ONELIVE_DB_DSN is empty — refusing to report a
          coverage number with no numerator, which would read as zero coverage}"
          # Written to a file first: `<<'PY' || { ... }` puts the heredoc body
          # inside the brace group and the shell never sees its terminator.
          cat > read_numerator.py <<'PY'
          import json, os, psycopg2
          # BOTH paths into the feed, or the numerator undercounts and the gap
          # reads as worse than it is. Licensed rows arrive from the ticketing
          # importers; everything else reaches a reader by being promoted out of
          # event_candidate. Reading only the first table hid every venue the
          # candidate pipeline covers — and those are exactly the long-tail
          # rooms the coverage work is aimed at.
          conn = psycopg2.connect(os.environ["ONELIVE_DB_DSN"])
          with conn, conn.cursor() as cur:
              cur.execute("""
                  select distinct venue_name, venue_city from (
                      select venue_name, venue_city
                        from licensed_event
                       where venue_name is not null
                      union
                      select venue_name, city as venue_city
                        from event_candidate
                       where venue_name is not null
                         and promoted_event_id is not null
                  ) both_paths
              """)
              rows = [{"venue_name": n, "venue_city": c} for n, c in cur.fetchall()]
          conn.close()
          json.dump(rows, open("ingested_venues.json", "w"), indent=2)
          print(f"read {len(rows)} distinct ingested venue(s) "
                f"across licensed + promoted-candidate paths")
          PY
          python read_numerator.py || {
            echo "::error::Could not read the numerator from the database." \
                 "The DENOMINATOR reported above is still VALID — it was" \
                 "measured successfully and does not depend on the database." \
                 "Only the 'how much of it do we cover' half is missing." \
                 "Fix ONELIVE_DB_DSN and re-run. Do NOT read this as zero" \
                 "coverage."
            exit 1
          }

      # The SCORE runs on push, which is the contract's done-criterion and was
      # not implemented — the report step was dispatch-only, so "the number is
      # never older than the last commit" was untrue on the very path that
      # makes it true. It runs WITHOUT --rows here, which the tool reports as
      # NO_NUMERATOR: the denominator with an explicit "the numerator was not
      # read", never a 0% that describes a measurement nobody made.
      # Runs on push AND on any dispatch that cannot reach the numerator. The
      # first version was the mirror image of the secret gate, so a dispatch
      # from a feature branch skipped BOTH steps and produced no coverage
      # output at all — the one path a person explicitly asked for a number on.
      # Evaluator nit, PR #84 r2.
      - name: Report coverage (denominator only — this path holds no secret)
        if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/master' }}
        run: |
          python tools/capcog_coverage.py \
            --targets sources/capcog_venue_targets.json \
            | tee coverage_report.txt

      - name: Report coverage (with the numerator)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
        run: |
          python tools/capcog_coverage.py \
            --rows ingested_venues.json \
            --targets sources/capcog_venue_targets.json \
            | tee coverage_report.txt

      # Coverage says HOW MUCH of the market we hold. The scorecard says WHICH
      # SOURCES are delivering it and which are dead — the two questions the
      # founder has to answer to know where the next unit of work goes. They run
      # together because they read the same database in the same job; splitting
      # them would double the Actions minutes to answer half a question each.




      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.inputs.skip_tabc == 'true' && 'capcog-coverage-CATALOG-FLOOR-ONLY' || 'capcog-coverage' }}
          path: |
            coverage_report.txt
            sources/capcog_venue_targets.json
            sources/tabc_capcog_raw.json
          if-no-files-found: warn
