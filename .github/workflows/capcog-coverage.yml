name: CAPCOG Coverage

# THE launch metric: what share of CAPCOG venues do we actually cover?
#
# Founder-directed 2026-07-26 — "If you haven't already created the 'total
# potential number of venues in CAPCOG' list and are comparing your data
# ingestion to that, you don't know what you're testing against."
#
# The dev sandbox has no outbound network, so the denominator fetch (TABC) runs
# HERE, where the importers already run. Manual dispatch on purpose: this is a
# measurement, not a gate, and it should be run when someone wants the number —
# not on every push, burning Actions minutes for an answer nobody is reading.

on:
  workflow_dispatch:
    inputs:
      skip_tabc:
        description: "Skip the TABC fetch and measure against the catalog layer only"
        required: false
        default: "false"

permissions:
  contents: read
  # Read-only, and only to fetch the PREVIOUS run's artifact so the scorecard
  # trend survives the ephemeral runner. Deliberately not `contents: write`:
  # persisting the history by committing it back would give a workflow write
  # access to the repository, which is a posture change, not a metrics chore.
  actions: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -q -r worker/requirements.txt

      # Layer 2. Fails LOUD on a schema change or a bad response rather than
      # yielding zero rows — "CAPCOG has no venues" would be a lie, not a result.
      - name: Fetch TABC licensed premises (denominator layer 2)
        if: ${{ github.event.inputs.skip_tabc != 'true' }}
        run: python tools/fetch_tabc_capcog.py

      - name: Build the venue target list
        run: |
          if [ -f sources/tabc_capcog_raw.json ]; then
            python tools/build_capcog_targets.py --tabc sources/tabc_capcog_raw.json
          else
            python tools/build_capcog_targets.py
          fi

      # The numerator: what we have actually ingested. Read-only.
      - name: Read ingested venues from the database
        env:
          ONELIVE_DB_DSN: ${{ secrets.ONELIVE_DB_DSN }}
        run: |
          : "${ONELIVE_DB_DSN:?ONELIVE_DB_DSN is empty — refusing to report a
          coverage number with no numerator, which would read as zero coverage}"
          python - <<'PY'
          import json, os, psycopg2
          # BOTH paths into the feed, or the numerator undercounts and the gap
          # reads as worse than it is. Licensed rows arrive from the ticketing
          # importers; everything else reaches a reader by being promoted out of
          # event_candidate. Reading only the first table hid every venue the
          # candidate pipeline covers — and those are exactly the long-tail
          # rooms the coverage work is aimed at.
          conn = psycopg2.connect(os.environ["ONELIVE_DB_DSN"])
          with conn, conn.cursor() as cur:
              cur.execute("""
                  select distinct venue_name, venue_city from (
                      select venue_name, venue_city
                        from licensed_event
                       where venue_name is not null
                      union
                      select venue_name, city as venue_city
                        from event_candidate
                       where venue_name is not null
                         and promoted_event_id is not null
                  ) both_paths
              """)
              rows = [{"venue_name": n, "venue_city": c} for n, c in cur.fetchall()]
          conn.close()
          json.dump(rows, open("ingested_venues.json", "w"), indent=2)
          print(f"read {len(rows)} distinct ingested venue(s) "
                f"across licensed + promoted-candidate paths")
          PY

      - name: Report coverage
        run: |
          python tools/capcog_coverage.py \
            --rows ingested_venues.json \
            --targets sources/capcog_venue_targets.json \
            | tee coverage_report.txt

      # Coverage says HOW MUCH of the market we hold. The scorecard says WHICH
      # SOURCES are delivering it and which are dead — the two questions the
      # founder has to answer to know where the next unit of work goes. They run
      # together because they read the same database in the same job; splitting
      # them would double the Actions minutes to answer half a question each.
      - name: Build the source registry
        run: python tools/build_source_registry.py

      # Fails the step when a database identifier maps to no registry source.
      # Those rows would be dropped, and the scorecard would then report a LIVE
      # feed as NEVER_TRIED — a confident lie about which sources work.
      - name: Dump per-source evidence
        env:
          ONELIVE_DB_DSN: ${{ secrets.ONELIVE_DB_DSN }}
        run: python tools/dump_source_evidence.py

      # The runner is ephemeral, so --record would append to a file that dies
      # with the job and the trend would read FIRST SNAPSHOT forever — the
      # "improvements over time" measure would never move. Restore the history
      # from the previous run's artifact first.
      #
      # The two failure modes are kept APART on purpose. "No previous run" is a
      # legitimate first snapshot. "The download broke" is a lost trend that
      # would look identical to a first snapshot and silently reset the baseline
      # every run. The first proceeds; the second fails the step.
      - name: Restore the scorecard history from the previous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An empty token makes the call unauthenticated, which returns no
          # artifacts and reads as "no previous run" — the trend would reset
          # every run and look like a first snapshot forever.
          : "${GH_TOKEN:?GH_TOKEN is empty — refusing to look up the previous
          scorecard artifact unauthenticated, because the empty result would be
          indistinguishable from there being no previous run}"
          api="https://api.github.com/repos/${{ github.repository }}"
          auth=(-sS -H "Authorization: Bearer $GH_TOKEN"
                -H "Accept: application/vnd.github+json")

          url=$(curl "${auth[@]}" \
                  "$api/actions/artifacts?name=capcog-coverage&per_page=1" \
                | python -c "import json,sys; a=json.load(sys.stdin)['artifacts']; print(a[0]['archive_download_url'] if a and not a[0]['expired'] else '')")

          if [ -z "$url" ]; then
            echo "No previous scorecard artifact — this is a genuine FIRST SNAPSHOT."
            exit 0
          fi

          if ! curl "${auth[@]}" -L -o prev.zip "$url"; then
            echo "::error::Previous scorecard artifact exists but could not be" \
                 "downloaded. Recording now would silently reset the trend" \
                 "baseline and read as a first snapshot. Refusing."
            exit 1
          fi
          mkdir -p docs/metrics
          unzip -o -j prev.zip 'docs/metrics/SOURCE_SCORECARD_HISTORY.jsonl' \
            -d docs/metrics/ || {
              echo "::error::Artifact downloaded but carries no history file." \
                   "Recording now would reset the trend baseline. Refusing."
              exit 1; }
          echo "restored $(wc -l < docs/metrics/SOURCE_SCORECARD_HISTORY.jsonl) prior snapshot(s)"

      - name: Score every source and record the snapshot
        run: |
          python tools/source_scorecard.py \
            --rows source_rows.json \
            --attempts source_attempts.json \
            --record --stamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee source_scorecard.txt

      # The artifact NAMES its own layer set (evaluator blocker r2): a
      # catalog-only run must not produce a file indistinguishable from a
      # full-layer measurement, because the filename is what gets quoted later.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.inputs.skip_tabc == 'true' && 'capcog-coverage-CATALOG-FLOOR-ONLY' || 'capcog-coverage' }}
          path: |
            coverage_report.txt
            source_scorecard.txt
            docs/metrics/SOURCE_SCORECARD_HISTORY.jsonl
            sources/capcog_venue_targets.json
            sources/tabc_capcog_raw.json
          if-no-files-found: warn
