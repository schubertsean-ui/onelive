name: apply-yearless-when
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("worker/locale_pack/desk_read.py")
          t = p.read_text(encoding="utf-8")
          n = t.replace("    del as_of\n", "", 1)
          n = n.replace(
              "    years = _years_in_date_context(text, page_html)\n    if not years:\n        return None\n",
              "    years = _years_in_date_context(text, page_html)\n    if not years and as_of is not None:\n        years = {as_of.year}\n    if not years:\n        years = {_date.today().year}\n",
              1,
          )
          if "del as_of" in n:
              raise SystemExit("del as_of still in file")
          if "if not years:\n        return None" in n:
              raise SystemExit("empty-year return None still in file")
          p.write_text(n, encoding="utf-8")
          print("deleted")
          PY
          git config user.name "schubertsean-ui"
          git config user.email "256894134+schubertsean-ui@users.noreply.github.com"
          git add worker/locale_pack/desk_read.py
          git diff --cached --quiet || git commit -m "Permanently delete year gate in _house_when."
          git push origin HEAD:master
