name: db-report

# Read-only production scope report (founder ask 2026-08-04: sources /
# segments / venues / artists / events per source — breadth and depth).
# Manual dispatch only. Holds the DB credential ONLY inside the report step
# (ingest.yml's scope+mask pattern, evaluator PR #19); the connection itself
# is opened read-only (default_transaction_read_only=on), so this workflow
# cannot write even by accident. Numbers land in the log and as an artifact.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate DSN + register log mask (before anything installs)
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing}"
          : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing}"
          python3 tools/assemble_dsn.py --mask-command
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: Run the read-only scope report
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          set -o pipefail
          : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing}"
          : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python3 tools/db_scope_report.py | tee db-scope-report.json
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: db-scope-report
          path: db-scope-report.json
          if-no-files-found: error
