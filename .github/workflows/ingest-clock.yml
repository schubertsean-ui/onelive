name: ingest-clock
# Replaces dispatch-only ingest. Founder 2026-09-09: system must walk without a chat.
# Every 2 hours UTC: desk-ingest write=true doors=all, then print live Showing N.
on:
  schedule:
    - cron: '25 */2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['desk-ingest']
    types: [completed]
jobs:
  kick:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start ingest write=true doors=all
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'desk-ingest.yml',
              ref: 'master',
              inputs: {
                write: 'true',
                doors: 'all',
                city: 'Austin',
                hours: '168',
                max_pages: '80',
              },
            });
  proof:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Proof line from 1live.co
        run: |
          echo "ingest conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "ingest sha=${{ github.event.workflow_run.head_sha }}"
          curl -sL https://1live.co/tonight | tr '\n' ' ' | grep -oE 'Showing [0-9]+ of [0-9]+' | head -1
          echo
          echo "That line is proof. Green ingest is not."
