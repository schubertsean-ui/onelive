name: apply-fl010-venue-id
on:
  workflow_dispatch:
  push:
    paths:
      - tools/apply_fl010_venue_id.py
      - .github/workflows/apply-fl010-venue-id.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite fill to event.venue_id
        run: python tools/apply_fl010_venue_id.py
      - name: Prove the product file writes venue_id
        run: |
          python -c "p=open('tools/desk_ingest.py',encoding='utf-8').read(); assert 'resolve_venue_id' in p; assert 'set venue_id' in p; assert 'fill(event_id, fill_patch(fresh' in p"
      - name: Commit wired desk_ingest.py
        run: |
          git config user.name "schubertsean-ui"
          git config user.email "256894134+schubertsean-ui@users.noreply.github.com"
          git add tools/desk_ingest.py
          if git diff --cached --quiet; then
            echo already wired
            exit 0
          fi
          git commit -m "FL-010: fill event.venue_id so Tonight can print Place."
          git push
