name: Extraction Golden-Set Exam — attended run

# The ONLY secret-bearing exam entry point (design v2, founder-directed
# 2026-07-15): GitHub environment "required reviewers" is an organization
# plan feature and unavailable on this personal repo, so the attended-human
# property is provided by the trigger itself — workflow_dispatch can only
# be fired manually by an identity with write access, never automatically
# by a push or PR event. PR-controlled code therefore runs with the
# Anthropic key ONLY when a maintainer deliberately dispatches it on a
# chosen branch.
#
# The PR-side release gate lives in extraction-eval.yml: it carries NO
# secrets and goes green only when a successful run of THIS workflow
# exists for the PR's exact head SHA, with a report artifact proving the
# pass was for the production-routed model and the PR's exact prompt.
#
# Thresholds live in ai/golden_exam.py (hallucination <= 1% founder-
# ratified; recall >= 0.80; zero forbidden injection markers; two >=300-
# fact floors — the set must CARRY >=300 expected facts or the run is
# INVALID, and a PASS requires >=300 ASSERTED facts, the 1% claim's
# denominator).
#
# Cost note (§14.3): one full exam = 77 small extraction calls — well
# under two dollars at any routed tier; the ANTHROPIC console spend cap
# bounds the blast radius regardless.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Candidate model id (leave empty to examine the production-routed model)"
        required: false
        default: ""

concurrency:
  group: extraction-exam-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-exam-attended:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment scopes ANTHROPIC_API_KEY_EXAM to exam runs only (the
    # repo-wide key is never referenced here). No protection rules are
    # assumed — the attended property comes from the dispatch trigger.
    environment: extraction-exam
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Resolve candidate model (input validated; empty = routed model)
        env:
          # Untrusted input reaches the shell only via env (never ${{ }}
          # inside run:) and must look like a model id (PR #12 lessons).
          RAW_MODEL: ${{ github.event.inputs.model }}
        run: |
          if [ -n "$RAW_MODEL" ]; then
            if ! [[ "$RAW_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
              echo "::error::model input is not a plausible model id (value redacted)."
              exit 1
            fi
            EXAM_MODEL="$RAW_MODEL"
          else
            EXAM_MODEL="$(python3 -c "from tools.model_router import STAGE_MODELS; print(STAGE_MODELS['extraction'])")"
            if ! [[ "$EXAM_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ ]]; then
              echo "::error::routed extraction model is not a plausible model id."
              exit 1
            fi
          fi
          echo "EXAM_MODEL=$EXAM_MODEL" >> "$GITHUB_ENV"

      - name: Run the golden-set exam
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EXAM }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY_EXAM is not configured as a secret of the 'extraction-exam' environment — the exam cannot run, and no-exam means no-pass (fail closed). Setup: Settings -> Environments -> extraction-exam -> Environment secrets."
            exit 1
          fi
          python -m ai.golden_exam --model "$EXAM_MODEL" --report exam-report.json

      - name: Persist the exam report (evidence artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-exam-report-${{ github.run_id }}
          path: exam-report.json
          # Evidence artifact on a release gate: absence on a SUCCESSFUL
          # run is itself a failure.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
