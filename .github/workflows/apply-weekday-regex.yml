name: apply-weekday-regex
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: python3 tools/fix_weekday_regex.py
      - name: Commit reader if changed
        run: |
          git config user.name "schubertsean-ui"
          git config user.email "256894134+schubertsean-ui@users.noreply.github.com"
          git add worker/locale_pack/desk_read.py
          if git diff --cached --quiet; then echo already; exit 0; fi
          git commit -m "Read Wednesday as well as Wed. Year still not a gate."
          git push origin HEAD:master
