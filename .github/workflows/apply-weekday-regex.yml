name: apply-weekday-regex
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/apply-weekday-regex.yml"]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("worker/locale_pack/desk_read.py")
          t = p.read_text(encoding="utf-8")
          old = r"\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\.?,?\s+"
          new = r"\b(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|Mon|Tue|Wed|Thu|Fri|Sat|Sun)\.?,?\s+"
          if old not in t:
              if new in t:
                  print("already")
              else:
                  raise SystemExit("pattern not found")
          else:
              t = t.replace(old, new, 1)
              p.write_text(t, encoding="utf-8")
              print("replaced")
          PY
          git config user.name "schubertsean-ui"
          git config user.email "256894134+schubertsean-ui@users.noreply.github.com"
          git add worker/locale_pack/desk_read.py
          git diff --cached --quiet || git commit -m "Read full weekdays. Wednesday matches."
          git push origin HEAD:master
