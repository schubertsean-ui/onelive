name: Weekly Source Catalog Backfill

on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays 9am America/Chicago (14:00 UTC in summer)
  workflow_dispatch: {}

concurrency:
  group: source-backfill
  cancel-in-progress: true

jobs:
  backfill:
    # SECRET CUSTODY — the dispatch path is restricted to the DEFAULT BRANCH.
    #
    # GitHub runs the workflow file from the ref you dispatch, and Actions secret
    # VALUES are write-only in the UI at every permission level — so an edited
    # branch plus one dispatch is a complete way to extract this job's stored
    # credentials. That is `CLASS:accepted-secret-custody-gap`, blocked on PR #80
    # after an earlier round accepted it in prose.
    #
    # THE COST, STATED: dispatching this from an unmerged feature branch no longer
    # works. Testing a change to this workflow means merging it first, then
    # dispatching from the default branch. The scheduled path is untouched — GitHub
    # only ever runs the default branch's copy on a schedule — so nothing about
    # normal operation changes.
    #
    # Compared against `github.event.repository.default_branch`, never a literal
    # name: a rename must not silently reopen this, and an absent field makes the
    # comparison false, which fails CLOSED (no run).
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Model resolved via the cost-routing policy (docs/MODEL_ROUTING.md),
      # never hardcoded — catalog research is a Standard-tier task. The
      # substitution runs in its own assignment (not inside echo) so a router
      # failure fails THIS STEP under `bash -e`, never becoming `model=`.
      - name: Resolve model (cost routing)
        id: route
        run: |
          model="$(python3 tools/model_router.py standard)"
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ steps.route.outputs.model }}
          max_turns: 12
          allowed_tools: "git,gh pr,web_search"
          prompt: |
            Read STATE.md and the source catalog file (ranks 42-118 are TODO placeholders).
            Research and propose 5-10 real Austin nightlife/event data sources
            (ticketing platforms, venue calendars, community/social sources, newsletters,
            city/municipal event listings) that aren't already in the catalog.
            Fill in real names, URLs, and a reasonable priority_score using the existing formula.
            Open a PR with your additions. Do not merge — this always needs founder review.
