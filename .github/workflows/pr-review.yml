name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine review depth
        id: depth
        run: |
          FILES=$(git diff --name-only origin/main...HEAD)
          echo "$FILES"
          if echo "$FILES" | grep -qE 'gating|promote|auth|payment|stripe'; then
            echo "model=claude-opus-4-6" >> "$GITHUB_OUTPUT"
            echo "max_turns=15" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            echo "max_turns=5" >> "$GITHUB_OUTPUT"
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ steps.depth.outputs.model }}
          max_turns: ${{ steps.depth.outputs.max_turns }}
          allowed_tools: "git,gh pr"
          prompt: |
            Review this PR against CLAUDE.md's review criteria. Check for:
            input validation on all API endpoints, parameterized queries only,
            auth checks on protected routes, and whether tastemaker-post code
            ever touches the event gating/promotion pipeline (it must not).
            Post your findings as a PR comment. Flag severity as blocking vs. suggestion.
