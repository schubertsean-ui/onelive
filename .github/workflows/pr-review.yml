name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action@v1 unconditionally requests an OIDC token during
      # startup even when a static ANTHROPIC_API_KEY is supplied (see
      # anthropics/claude-code-action#649). Without id-token:write it dies with
      # "Could not fetch an OIDC token". Granting it is harmless: auth still
      # uses the API key; this only lets the action mint the token it insists on.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history so the base..HEAD diff resolves

      - name: Require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Fail LOUDLY and specifically if the secret is unset. Without this,
          # claude-code-action falls back to OIDC and dies with an opaque
          # "Could not fetch an OIDC token" error that hides the real cause
          # (a missing repo secret). Never let "misconfigured" look like
          # "something else broke".
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing secret::ANTHROPIC_API_KEY repo secret is not set. Add it under Settings -> Secrets and variables -> Actions. The Claude PR review gate cannot run without it."
            exit 1
          fi

      - name: Determine review depth
        id: depth
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Diff against the PR's actual base branch (master), not a hardcoded
          # 'main' which does not exist in this repo and made this step error out
          # in ~7s, silently disabling the review gate for every PR.
          git fetch --no-tags origin "$BASE_REF"
          FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "$FILES"
          if echo "$FILES" | grep -qE 'gating|promote|auth|payment|stripe'; then
            echo "model=claude-opus-4-8" >> "$GITHUB_OUTPUT"
            echo "max_turns=15" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
            echo "max_turns=5" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to an exact release, NOT the floating @v1 tag. @v1 silently moves
      # when Anthropic ships new builds, which is how the input/model schema
      # drifted out from under this workflow before. Pinning keeps CI
      # deterministic; bump this deliberately, never implicitly.
      - uses: anthropics/claude-code-action@v1.0.171
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # v1 moved model / max-turns / tool allowlist out of top-level inputs
          # and into claude_args (Claude Code SDK CLI flags). The old top-level
          # `model`/`max_turns`/`allowed_tools` inputs are rejected as "Unexpected
          # input(s)" by @v1 and must not be used.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.max_turns }}
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            Review this pull request against the review criteria in CLAUDE.md.
            Check specifically for:
              - input validation on all API endpoints,
              - parameterized queries only (no string-built SQL),
              - auth checks on protected routes,
              - and whether any tastemaker-post code ever touches the event
                gating/promotion pipeline (it must not).
            Post your findings as a single PR comment. Flag each finding's
            severity as either "blocking" or "suggestion".
