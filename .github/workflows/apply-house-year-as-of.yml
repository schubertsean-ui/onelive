name: apply-house-year-as-of
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('worker/locale_pack/desk_read.py')
          t = p.read_text()
          old = '''    del as_of
    text = (card_text or "").strip()
    if not text:
        return None
    hits = list(_HOUSE_WD_MD_RE.finditer(text))
    if len(hits) != 1:
        return None
    wd, mon, day_s = hits[0].groups()
    month = _HOUSE_MONTHS[mon.lower()]
    day = int(day_s)
    weekday = _HOUSE_WEEKDAYS[wd[:3].lower()]
    years = _years_in_date_context(text, page_html)
    if not years:
        return None'''
          new = '''    text = (card_text or "").strip()
    if not text:
        return None
    hits = list(_HOUSE_WD_MD_RE.finditer(text))
    if len(hits) != 1:
        return None
    wd, mon, day_s = hits[0].groups()
    month = _HOUSE_MONTHS[mon.lower()]
    day = int(day_s)
    weekday = _HOUSE_WEEKDAYS[wd[:3].lower()]
    years = _years_in_date_context(text, page_html)
    if not years and as_of is not None:
        years = [as_of.year]
    if not years:
        return None'''
          if old not in t:
              raise SystemExit('block missing')
          p.write_text(t.replace(old, new, 1))
          print('applied')
          PY
      - run: |
          git config user.name schubertsean-ui
          git config user.email 256894134+schubertsean-ui@users.noreply.github.com
          git add worker/locale_pack/desk_read.py
          git diff --cached --quiet || git commit -m "Yearless card date uses the walk year. Year is not a gate."
          git push origin HEAD:master
