name: site-health

# Reads the DEPLOYED site's /api/health and prints the answer into the job log.
#
# Why this exists: the agent sandbox's network policy blocks both *.vercel.app
# and the Supabase host (403 to CONNECT), so nobody working in a session can
# answer "is the site up, and does the feed have anything in it?" without asking
# the founder to open a browser. That made every deployment question a founder
# interrupt. GitHub's runners have open egress, which is the SAME reason
# import_licensed.yml runs here rather than in the sandbox — this follows that
# established pattern, it does not invent a new one.
#
# Reads only. No secrets, no database write, no AI spend, no schedule — so it
# needs no dead-man alarm (the charter requires one for scheduled loops) and
# cannot cost anything. Run it from the Actions tab, or an agent can trigger it
# and read the result out of the job log.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL of the deployment to check (no trailing slash)"
        required: true
  # [R-069] Also runs on this PR, deliberately and temporarily. workflow_dispatch can
  # only be triggered via the API once the file exists on the DEFAULT branch, so
  # until this merges the dispatch path is unusable and the check would be dead
  # on arrival. The pull_request path uses the branch's Vercel alias, which is
  # stable across commits. R-069 carries the removal trigger.
  pull_request:
    branches: [master]
    paths: [".github/workflows/site_health.yml"]

permissions:
  contents: read

concurrency:
  group: site-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read /api/health and report honestly
        env:
          # The pull_request side is pinned to a LITERAL, never a bare
          # `github.event.inputs.*` — that expression is empty on any event
          # other than workflow_dispatch, which is exactly the defect that made
          # import_structured.yml's cron dead on arrival (R-054, the project's
          # first recorded escape). tests/test_scheduled_inputs_contract.py
          # guards the schedule form of this class; this is the same discipline
          # applied to the pull_request form.
          BASE_URL: ${{ github.event_name == 'pull_request' && 'https://onelive-git-claude-onelive-v1-eval-90b9d1-sss-projects-e4775771.vercel.app' || github.event.inputs.url }}
          # Defaults to the literal sentinel ABSENT rather than an empty string,
          # so "no secret configured" is a STATED value the shell can guard and
          # branch on. GitHub renders an unset secret and a set-but-empty secret
          # identically, and treating that ambiguity as a value is the empty-env
          # fail-open class this repo has already hit four times.
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS || 'ABSENT' }}
        run: |
          set -uo pipefail
          : "${BASE_URL:?url input missing — the target is required — failing closed}"
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::url must start with https:// (got '$BASE_URL')"; exit 1 ;;
          esac

          # If the founder has created a Vercel "Protection Bypass for
          # Automation" secret, use it — that is the ONE action that makes every
          # future deployment agent-verifiable instead of founder-verifiable.
          # Absent, the request goes bare and the verdict says so; a missing
          # secret must never look like a passing check.
          : "${VERCEL_BYPASS:?VERCEL_BYPASS resolved empty — it must be the secret or the literal ABSENT, never blank — failing closed}"
          # Assigned unconditionally before any branch: a variable that only
          # exists down one code path is the same ambiguity in miniature.
          BYPASS_STATE="ABSENT — no VERCEL_AUTOMATION_BYPASS secret; request sent bare"
          HDR=()
          if [ "$VERCEL_BYPASS" != "ABSENT" ]; then
            HDR=(-H "x-vercel-protection-bypass: ${VERCEL_BYPASS}")
            BYPASS_STATE="present"
          fi
          echo "protection_bypass_secret: $BYPASS_STATE"

          echo "=== GET $BASE_URL/api/health ==="
          CODE="$(curl -sS -m 30 -o /tmp/health.body -w '%{http_code}' \
                    "${HDR[@]}" "$BASE_URL/api/health" || echo "000")"
          echo "http_status: $CODE"
          echo "--- body (first 2000 bytes) ---"
          head -c 2000 /tmp/health.body || true
          echo
          echo "--- end body ---"

          # The three states worth distinguishing, because "we failed" must never
          # look identical to "there was nothing to do" (CLAUDE.md).
          case "$CODE" in
            200)
              echo "VERDICT: reachable and PUBLIC — a friend with this link can open it."
              ;;
            302|307|401|403)
              echo "VERDICT: reachable but GATED — the host answered, and refused."
              echo "  A FRIEND CLICKING THIS LINK CANNOT SEE THE PRODUCT."
              echo "  302/307 with a 'Redirecting...' body is Vercel Deployment"
              echo "  Protection bouncing to its SSO login. 401/403 with JSON is the"
              echo "  app's own fail-closed gate instead. The body above says which."
              # Full URLs, never a click-path (CLAUDE.md prime directive 6 part 3).
              # Source of truth for these links: docs/DEPLOY.md "The console links".
              echo "  TO FIX — pick one:"
              echo "  (1) LETS FRIENDS IN, ~30s. Set Vercel Authentication to Disabled at"
              echo "      https://vercel.com/sss-projects-e4775771/onelive/settings/deployment-protection"
              echo "  (2) AGENT VERIFICATION ONLY, ~90s. On that same page use"
              echo "      'Protection Bypass for Automation' -> Add Secret, then add the value as"
              echo "      the repository secret VERCEL_AUTOMATION_BYPASS at"
              echo "      https://github.com/schubertsean-ui/onelive/settings/secrets/actions/new"
              exit 1
              ;;
            000)
              echo "VERDICT: UNREACHABLE — no HTTP response at all (DNS, TLS or timeout)."
              exit 1
              ;;
            *)
              echo "VERDICT: unexpected status $CODE — reported, not interpreted."
              exit 1
              ;;
          esac

          # Only reached on 200. eventCount is the go/no-go for a real test:
          # a live site showing zero events is a worse first impression than no
          # site at all, so this reports it loudly rather than passing quietly.
          COUNT="$(python3 -c "import json,sys;d=json.load(open('/tmp/health.body'));print(d.get('supabase',{}).get('eventCount','UNKNOWN'))" 2>/dev/null || echo "UNPARSEABLE")"
          echo "event_count: $COUNT"
          if [ "$COUNT" = "0" ]; then
            echo "::warning::The site is up and the feed is EMPTY. Run import-licensed before showing anyone."
          fi
