name: autopromote

# The ratified earned-confidence publish pass — the ONLY scheduled path that
# promotes candidates to the public feed. Founder-ratified TWICE, verbatim on
# record:
#   * 2026-07-25: "I told you to prep to enable AI to post without human
#     approval except for exceptions or sources we have graded as often
#     unreliable." (decision record
#     2026-07-25_auto-publish-earned-confidence-ratification.md — built the
#     machinery, fail-closed OFF)
#   * 2026-08-04: "I cannot personally and individually approve hundreds of
#     entries. If the logic of our verification is solid … and our checks and
#     balances are working properly … then publish without my personal and
#     individual approvals." (decision record
#     2026-08-04_auto-publish-flip.md — flips the switch, THIS file)
# Everything fail-closed lives in code, not here: worker/publish_policy.py
# (ESCALATE/unreliable-source/fabrication-risk → human review, never
# published), worker/autopromote.py (the only promoter beyond ops),
# worker/run_autopromote.py (--real + --limit mandatory, Sentry + dead-man
# ping around every pass). Turning auto-publish OFF again is a one-line edit
# of the literal below (or disabling this workflow) — auditable either way.

on:
  schedule:
    # Hourly at :15 — offset from ingest (:09/:29/:49) and the import crons so
    # scheduled jobs never contend for the DB at the same minute.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Batch ceiling for this pass (positive integer)"
        required: false
        default: "200"
      stamp_limit:
        description: "Gate-stamp sweep ceiling before the promote phase (0 skips the sweep)"
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: autopromote
  cancel-in-progress: false

jobs:
  autopromote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: Run one bounded auto-promote pass (earned-confidence publish)
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Dedicated dead-man check for THIS loop (charter Sentinel rule: no
          # scheduled loop without one) — the sentinel module reads
          # ORCHESTRATOR_PING_URL, and we bind the autopromote-specific
          # healthchecks URL to it so this loop's silence raises its own
          # alarm instead of hiding inside the ingest check's.
          ORCHESTRATOR_PING_URL: ${{ secrets.AUTOPROMOTE_PING_URL }}
          # THE FOUNDER-FLIPPED SWITCH (see header). A literal, not a secret
          # or vars.* — visible in diff/blame, reversible in one line.
          AUTO_PUBLISH_RATIFIED: "1"
          LIMIT: ${{ github.event.inputs.limit || '200' }}
          # Gate-stamp sweep ceiling (DB-only classification of the
          # never-stamped backlog; runs before the promote phase). Same
          # schedule-vs-dispatch shape as LIMIT.
          STAMP_LIMIT: ${{ github.event.inputs.stamp_limit || '1000' }}
        run: |
          : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing — add it in repo Settings → Secrets → Actions}"
          : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing — add it in repo Settings → Secrets → Actions}"
          : "${SENTRY_DSN:?SENTRY_DSN secret missing — Sentinel rule: no scheduled loop without error monitoring}"
          : "${ORCHESTRATOR_PING_URL:?AUTOPROMOTE_PING_URL secret missing — Sentinel rule: no scheduled loop without a dead-man ping (create a healthchecks.io check named onelive-autopromote and add its ping URL as the AUTOPROMOTE_PING_URL secret)}"
          : "${LIMIT:?limit missing — the batch ceiling is required}"
          : "${STAMP_LIMIT:?stamp_limit missing — the sweep ceiling is required}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python worker/run_autopromote.py --real --limit "$LIMIT" --stamp-limit "$STAMP_LIMIT"
