name: import-licensed

# Deterministic licensed-feed import: Ticketmaster Discovery + SeatGeek -> licensed_event.
# NO AI, NO extraction spend (this is not the AI ingest cron; it does not run
# worker/run_once.py and is not covered by the arming-evidence binding). Runs on
# GitHub's runners, where egress reaches the provider APIs (the dev sandbox's
# network policy blocks it). Scheduled twice daily so a live site stays fresh
# without a manual click, plus manual workflow_dispatch for on-demand refreshes.

on:
  schedule:
    # Twice daily at 08:00 and 20:00 UTC (~3am/3pm Central), offset from the
    # structured-import cron so the two do not contend for a runner or the DB.
    # GitHub runs scheduled workflows ONLY from the default branch, and its
    # scheduler has known pickup lag — both expected.
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Provider pages to fetch per window (100 events/page)"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: import-licensed
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: Apply migrations (idempotent) + import Ticketmaster CAPCOG events + backfill venue contact
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
        run: |
          : "${TICKETMASTER_API_KEY:?TICKETMASTER_API_KEY secret missing — add it in repo Settings → Secrets → Actions}"
          : "${MAX_PAGES:?max_pages missing — the fetch bound is required}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python3 tools/apply_migration.py supabase/migrations/0010_licensed_feed_and_domains.sql
          # 0014 adds venue_url/venue_phone; must exist BEFORE the import writes them.
          python3 tools/apply_migration.py supabase/migrations/0014_venue_contact.sql
          # 0017 grants anon SELECT on venue_url/venue_phone — 0014 added the
          # columns but a column-level grant never covered them, so the feed 401'd.
          python3 tools/apply_migration.py supabase/migrations/0017_grant_licensed_venue_contact_read.sql
          python -m worker.importers.run_licensed_import --max-pages "$MAX_PAGES"
          # Fill venue contact onto rows imported before the columns existed,
          # from the raw payload already stored (no re-fetch). Idempotent.
          python3 tools/backfill_venue_contact.py
      - name: Import SeatGeek CAPCOG events (same licensed_event store)
        # continue-on-error: SeatGeek is an ADDITIVE second provider. If its key
        # is absent/misconfigured the step still fails LOUD (the guard below +
        # a visible red step in the run), but it must NOT fail the whole ticketed
        # import — Ticketmaster already wrote 1300+ events in the step above.
        # This keeps the pipeline from chronically red-flagging on an optional
        # provider's missing key while still surfacing the exact reason. The
        # fail-closed guard is retained (workflow_env_lint R4 stays satisfied);
        # only the JOB conclusion is spared, never the visibility of the failure.
        continue-on-error: true
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          # Optional companion credential (consumed by worker/importers/seatgeek.py
          # from the environment, never expanded in shell text — R4's implicit-
          # inheritance boundary; the importer treats absence as client_id-only
          # auth by design). New SeatGeek registrations 403 without it.
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
        run: |
          # Fail-closed like the Ticketmaster step (workflow_env_lint R4): a
          # missing key is a loud, visible failure, never a silent skip. With
          # continue-on-error above, this red is surfaced but does not sink the
          # ticketed import; it means "add or fix the SeatGeek secret".
          : "${SEATGEEK_CLIENT_ID:?SEATGEEK_CLIENT_ID secret missing — add it in repo Settings → Secrets → Actions}"
          : "${MAX_PAGES:?max_pages missing — the fetch bound is required}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          # Migration 0010 (licensed_event + domains) was applied idempotently by
          # the Ticketmaster step above; SeatGeek upserts into the same table.
          python -m worker.importers.run_seatgeek_import --max-pages "$MAX_PAGES"
