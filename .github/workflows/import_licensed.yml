name: import-licensed

# Deterministic licensed-feed import: Ticketmaster Discovery → licensed_event.
# NO AI, NO extraction spend (this is not the AI ingest cron; it does not run
# worker/run_once.py and is not covered by the arming-evidence binding). Runs on
# GitHub's runners, where egress reaches Ticketmaster (the dev sandbox's network
# policy blocks it). Triggered manually via workflow_dispatch.

on:
  # Founder-directed 2026-07-26 ("do 2", answering docs/V1.md ask 1): the bulk of
  # the feed now refreshes itself. 02:23 and 14:23 UTC — 12 h apart, deliberately
  # offset from import_structured.yml's 08:17/20:17 so the two importers never
  # contend for the same database connection window.
  #
  # ITS DEAD-MAN ALARM IS .github/workflows/watchdog.yml, not a healthchecks.io
  # ping — accepted by the founder-amended Sentinel clause in CLAUDE.md and
  # recorded at docs/memory/decisions/2026-07-26_github-native-watchdog.md. This
  # workflow is in the watchdog's WATCHED table, so a silent stop is caught.
  # The charter's "no scheduled loop ships without both" is satisfied, not waived.
  schedule:
    - cron: "23 2,14 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Ticketmaster pages to fetch (100 events/page; deep-paging caps ~9)"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: import-licensed
  cancel-in-progress: false

jobs:
  import:
    # SECRET CUSTODY — the dispatch path is restricted to the DEFAULT BRANCH.
    #
    # GitHub runs the workflow file from the ref you dispatch, and Actions secret
    # VALUES are write-only in the UI at every permission level — so an edited
    # branch plus one dispatch is a complete way to extract this job's stored
    # credentials. That is `CLASS:accepted-secret-custody-gap`, blocked on PR #80
    # after an earlier round accepted it in prose.
    #
    # THE COST, STATED: dispatching this from an unmerged feature branch no longer
    # works. Testing a change to this workflow means merging it first, then
    # dispatching from the default branch. The scheduled path is untouched — GitHub
    # only ever runs the default branch's copy on a schedule — so nothing about
    # normal operation changes.
    #
    # Compared against `github.event.repository.default_branch`, never a literal
    # name: a rename must not silently reopen this, and an absent field makes the
    # comparison false, which fails CLOSED (no run).
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: Apply migration 0010 (idempotent) + import Ticketmaster CAPCOG events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
        run: |
          : "${TICKETMASTER_API_KEY:?TICKETMASTER_API_KEY secret missing — add it in repo Settings → Secrets → Actions}"
          : "${MAX_PAGES:?max_pages missing — the fetch bound is required}"
          ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
          export ONELIVE_DB_DSN
          python3 tools/apply_migration.py supabase/migrations/0010_licensed_feed_and_domains.sql
          python -m worker.importers.run_licensed_import --max-pages "$MAX_PAGES"
