name: apply-fill-not-dispute
on:
  push:
    paths: [.github/workflows/apply-fill-not-dispute.yml]
jobs:
  apply:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch product files
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("worker/locale_pack/desk_publish.py")
          t = p.read_text()
          old = '''    return [f for f in drift(stored, fresh) if f in CONTRADICTING]'''
          new = '''    # A hole that the same desk now fills is not a contradiction.
    # None -> 2026-09-10 is a date fill. Two different dates is a dispute.
    if not stored:
        return []
    return [
        f for f in drift(stored, fresh)
        if f in CONTRADICTING and stored.get(f) and fresh.get(f)
    ]'''
          if old not in t:
              raise SystemExit("contradicts return not found")
          t = t.replace(old, new, 1)
          old_tix = '    "ticket_link": None,'
          new_tix = '    "ticket_link": (row.extracted.get("ticket_link") if hasattr(row, "extracted") else None) or getattr(row, "ticket_link", None),'
          if old_tix not in t:
              raise SystemExit("ticket_link None not found")
          t = t.replace(old_tix, new_tix, 1)
          p.write_text(t)
          print("desk_publish.py patched")
          PY
      - name: Commit if changed
        run: |
          git config user.name "schubertsean-ui"
          git config user.email "256894134+schubertsean-ui@users.noreply.github.com"
          git add worker/locale_pack/desk_publish.py
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "A date fill is not a dispute. Keep a printed tickets link."
          git push
