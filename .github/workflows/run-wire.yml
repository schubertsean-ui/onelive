name: run-wire
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/run-wire.yml
      - tools/patch_ingest_key.py
jobs:
  apply:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch save key
        run: python3 tools/patch_ingest_key.py
      - name: Commit if changed
        run: |
          git config user.name schubertsean-ui
          git config user.email 256894134+schubertsean-ui@users.noreply.github.com
          git add worker/locale_pack/desk_publish.py
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "Save key is listing URL plus that night."
          git push
