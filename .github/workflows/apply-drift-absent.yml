name: apply-drift-absent
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/apply-drift-absent.yml"]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: |
          python3 tools/fix_drift_absent.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/test_desk_publish.py")
          t = p.read_text(encoding="utf-8")
          old = "test_a_row_written_before_statements_existed_is_not_reported_as_changed"
          new = "test_a_row_written_before_statements_existed_treats_new_fields_as_change"
          if new in t:
              print("test already flipped")
          elif old not in t:
              raise SystemExit("old drift test missing")
          else:
              t = t.replace(old, new, 1)
              t = t.replace(
                  "assert drift(None, _stmt()) == []",
                  "assert 'night' in drift(None, {'title': 'X', 'place': 'Y', 'night': '2026-09-09'})",
                  1,
              )
              t = t.replace(
                  "assert drift({}, _stmt()) == []",
                  "assert 'night' in drift({}, {'title': 'X', 'place': 'Y', 'night': '2026-09-09'})\n    assert drift(None, {}) == []\n    assert drift({}, {}) == []",
                  1,
              )
              p.write_text(t, encoding="utf-8")
              print("test flipped")
          PY
          git config user.name "schubertsean-ui"
          git config user.email "256894134+schubertsean-ui@users.noreply.github.com"
          git add worker/locale_pack/desk_publish.py tests/test_desk_publish.py
          git diff --cached --quiet || git commit -m "Absent statement + new date is a change, not a skip."
          git push origin HEAD:master
