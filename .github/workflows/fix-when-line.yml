name: fix-when-line
on:
  push:
    paths:
      - .github/workflows/fix-when-line.yml
      - tools/fix_when_line.py
  workflow_dispatch:
jobs:
  apply:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/fix_when_line.py
      - run: |
          git config user.name schubertsean-ui
          git config user.email 256894134+schubertsean-ui@users.noreply.github.com
          git add worker/locale_pack/desk_read.py
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "Read the printed time line as the night."
          git push
