name: verify-site
# Prove the DEPLOYED page is shareable, not just that the data exists.
#
# Runs HERE and not in the agent sandbox for a concrete reason: the agent's proxy
# denies vercel.app (connect_rejected), so the agent physically cannot open the
# site it builds. GitHub Actions has egress. Moving the CHECK to where the
# network works is the fix; reporting import counts as if they proved the page
# was the avoidance (founder, 2026-07-25: "fix this, not avoid it").
#
# FAILS LOUD on: unreachable, non-200, empty body, zero events declared, or
# events missing a title/start time. A deploy that succeeds and shows nothing is
# a FAILURE here, because "deployed" and "shareable" are different claims.
#
# Targets come from the REVIEWED file config/site_targets.json, never a `vars.`
# context: an unset repository variable and an empty one render identically, so
# nothing downstream could fail closed on the difference (workflow_env_lint,
# empty-env class). A URL change is therefore a reviewed diff.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Named target from config/site_targets.json (e.g. production, preview)"
        required: true
        default: "preview"
  schedule:
    # Twice daily, shortly after each scheduled import lands (import runs at
    # 08:17 and 20:17 UTC), so a silently-empty feed is caught within hours
    # instead of by the founder opening the link.
    - cron: "45 8,20 * * *"

permissions:
  contents: read

concurrency:
  group: verify-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the deployed page renders real events
        env:
          # Scheduled runs carry no dispatch input; 'production' is the default
          # so the schedule always checks the surface that matters.
          TARGET: ${{ github.event.inputs.target || 'production' }}
        run: |
          # TERMINATING guard before first use: an expression that renders empty
          # must stop the job, never proceed silently (empty-env class).
          : "${TARGET:?target did not resolve — refusing to run a check that cannot fail}"
          python3 tools/verify_deployed_site.py --target "${TARGET}"
