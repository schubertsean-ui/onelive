name: desk-ingest

# Walk the local desks LIVE and write what they printed into the catalog.
# Proof is 1live.co Showing N of M, not a green job.

on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: "Actually write (candidates + promote). Leave false for a live dry run."
        type: boolean
        default: true
      city:
        description: "City the before/after /tonight counts are taken for"
        type: string
        default: "Austin"
      hours:
        description: "The wide /tonight window to count, in hours (168 = this week)"
        type: string
        default: "168"
      doors:
        description: Space-separated door_ids to walk, or `all` for every public door in the locale pack.
        type: string
        default: "all"
      max_pages:
        description: Runaway page ceiling per desk when the desk does not print a last page.
        type: string
        default: "80"

permissions:
  contents: read

concurrency:
  group: desk-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate DSN + register log mask (before anything installs)
        if: ${{ github.event_name == 'schedule' || inputs.write }}
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
        run: |
          : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing}"
          : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing}"
          python3 tools/assemble_dsn.py --mask-command

      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Walk the desks and write
        env:
          ONELIVE_DB_DSN_RAW: ${{ secrets.ONELIVE_DB_DSN }}
          ONELIVE_DB_PASSWORD: ${{ secrets.ONELIVE_DB_PASSWORD }}
          IN_WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
          IN_CITY: ${{ inputs.city || 'Austin' }}
          IN_HOURS: ${{ inputs.hours || '168' }}
          IN_DOORS: ${{ inputs.doors || 'all' }}
          IN_MAX_PAGES: ${{ inputs.max_pages || '80' }}
        run: |
          set -euo pipefail
          : "${IN_WRITE:?dispatch input 'write' is empty}"
          : "${IN_CITY:?dispatch input 'city' is empty}"
          : "${IN_HOURS:?dispatch input 'hours' is empty}"
          : "${IN_DOORS:?dispatch input 'doors' is empty}"
          : "${IN_MAX_PAGES:?dispatch input 'max_pages' is empty}"
          args=(--real --city "$IN_CITY" --hours "$IN_HOURS" --max-pages "$IN_MAX_PAGES")
          doors_to_walk=$(printf '%s' "$IN_DOORS" | sed -e 's/^all$//')
          for door in $doors_to_walk; do
            args+=(--door "$door")
          done
          if [ "$IN_WRITE" = "true" ]; then
            : "${ONELIVE_DB_DSN_RAW:?ONELIVE_DB_DSN secret missing}"
            : "${ONELIVE_DB_PASSWORD:?ONELIVE_DB_PASSWORD secret missing}"
            ONELIVE_DB_DSN="$(python3 tools/assemble_dsn.py)"
            export ONELIVE_DB_DSN
            args+=(--write)
          else
            args+=(--dry-run)
          fi
          python3 tools/desk_ingest.py "${args[@]}" | tee desk-ingest-report.md

      - name: Put the report in the run summary
        if: always()
        run: |
          if [ -f desk-ingest-report.md ]; then
            cat desk-ingest-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The run produced no report — read the step log above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-ingest-report
          path: desk-ingest-report.md
          if-no-files-found: warn

      - name: Prove live count
        if: always()
        run: |
          set -euo pipefail
          page=$(curl -fsSL "https://1live.co/tonight?t=${GITHUB_RUN_ID}")
          line=$(printf '%s' "$page" | tr '\n' ' ' | grep -oE 'Showing [0-9,]+ of [0-9,]+' | head -1 || true)
          echo "${line:-Showing line not found}"
          echo "## Live proof" >> "$GITHUB_STEP_SUMMARY"
          echo "${line:-Showing line not found}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://1live.co/tonight" >> "$GITHUB_STEP_SUMMARY"
