name: provider-dryrun

# R-029's verification harness: a NEW licensed provider's FIRST live call is a
# --dry-run — fetch + normalize + summarize, NO DB write — so the payload-shape
# assumptions recorded on each importer are verified against reality before the
# feed ever seeds licensed_event. Manual dispatch only; runs on GitHub's
# runners because the dev sandbox's egress policy blocks provider APIs. This
# workflow holds NO database credentials at all — a dry-run that cannot write
# is enforced by omission, not just by flag.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which provider to dry-run"
        required: true
        type: choice
        options:
          - seatgeek
          - eventbrite
          - eventbrite-discover
          - eventbrite-harvest
          - eventbrite-search
      max_pages:
        description: "Pages per window/id (bounded fetch)"
        required: false
        default: "2"
      eventbrite_ids:
        description: "Eventbrite ORGANIZATION ids, comma-separated (required for eventbrite: public search was removed in 2020, the trusted id list IS the query)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: provider-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
      - name: SeatGeek dry-run (fetch + normalize + summarize, NO DB write)
        if: ${{ github.event.inputs.provider == 'seatgeek' }}
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          # Optional companion credential (consumed by worker/importers/seatgeek.py
          # from the environment, never expanded in shell text — R4's implicit-
          # inheritance boundary; the importer treats absence as client_id-only
          # auth by design). New SeatGeek registrations 403 without it.
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '2' }}
        run: |
          : "${SEATGEEK_CLIENT_ID:?SEATGEEK_CLIENT_ID secret missing — add it in repo Settings → Secrets → Actions}"
          : "${MAX_PAGES:?max_pages missing — the fetch bound is required}"
          python -m worker.importers.run_seatgeek_import --max-pages "$MAX_PAGES" --dry-run
      - name: Eventbrite ORGANIZER DISCOVERY (public pages only, catalog-allowed; no API, no DB)
        if: ${{ github.event.inputs.provider == 'eventbrite-discover' }}
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '2' }}
        run: |
          # pipefail is load-bearing: without it, `| tee` masks the script's
          # fail-loud exit 3 and a ZERO-RESULT discovery goes green — exactly
          # the "empty green" the tool's contract forbids (caught on run 1:
          # six 405s, 0 ids, step green; Kaizen 2026-08-04).
          set -o pipefail
          : "${MAX_PAGES:?max_pages missing — the crawl bound is required}"
          python3 tools/discover_eventbrite_orgs.py --max-pages "$MAX_PAGES" | tee eventbrite-org-candidates.json
      - name: Upload discovery candidates (human review before anything is committed)
        if: ${{ github.event.inputs.provider == 'eventbrite-discover' }}
        uses: actions/upload-artifact@v4
        with:
          name: eventbrite-org-candidates
          path: eventbrite-org-candidates.json
          if-no-files-found: error
      - name: Eventbrite HARVEST from our own catalog pages (path 1 — no eventbrite.com fetch)
        if: ${{ github.event.inputs.provider == 'eventbrite-harvest' }}
        env:
          MAX_SOURCES: ${{ github.event.inputs.max_pages || '0' }}
          # Official-API resolver credential (consumed by the resolve step's
          # python process from the environment — R4 implicit-inheritance
          # boundary; absence skips resolution, harvest still uploads).
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: |
          # pipefail is load-bearing (Kaizen 2026-08-04 pipe-masked-exit rule):
          # the harvester's fail-loud exits must fail this step through tee.
          set -o pipefail
          : "${MAX_SOURCES:?max_pages input missing — the fetch bound is required (0 = all eligible)}"
          python3 tools/harvest_eventbrite_links.py --max-sources "$MAX_SOURCES" | tee eventbrite-harvest.json
          if [ -n "$EVENTBRITE_TOKEN" ]; then
            python3 tools/resolve_eventbrite_event_orgs.py --harvest eventbrite-harvest.json | tee eventbrite-resolved-orgs.json
          else
            echo "EVENTBRITE_TOKEN absent — event-id → organizer resolution skipped (harvest artifact still uploads)"
            printf '{"events_requested": 0, "events_failed": 0, "organizers": []}\n' > eventbrite-resolved-orgs.json
          fi
      - name: Upload harvest candidates (human review before anything is committed)
        if: ${{ github.event.inputs.provider == 'eventbrite-harvest' }}
        uses: actions/upload-artifact@v4
        with:
          name: eventbrite-harvest-candidates
          path: |
            eventbrite-harvest.json
            eventbrite-resolved-orgs.json
          if-no-files-found: error
      - name: Eventbrite SEARCH discovery (path 2 — Google Programmable Search API)
        if: ${{ github.event.inputs.provider == 'eventbrite-search' }}
        env:
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          MAX_QUERIES: ${{ github.event.inputs.max_pages || '8' }}
        run: |
          set -o pipefail
          : "${GOOGLE_CSE_KEY:?GOOGLE_CSE_KEY secret missing — free key: https://developers.google.com/custom-search/v1/introduction}"
          : "${GOOGLE_CSE_CX:?GOOGLE_CSE_CX secret missing — engine id: https://programmablesearchengine.google.com/}"
          : "${MAX_QUERIES:?max_pages input missing — the API-call bound is required}"
          python3 tools/search_discover_eventbrite.py --max-queries "$MAX_QUERIES" | tee eventbrite-search-candidates.json
      - name: Upload search candidates (human review before anything is committed)
        if: ${{ github.event.inputs.provider == 'eventbrite-search' }}
        uses: actions/upload-artifact@v4
        with:
          name: eventbrite-search-candidates
          path: eventbrite-search-candidates.json
          if-no-files-found: error
      - name: Eventbrite EVENT-ID dry-run (the third-party-viable id space; NO DB write)
        if: ${{ github.event.inputs.provider == 'eventbrite-events' }}
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EB_IDS: ${{ github.event.inputs.eventbrite_ids }}
        run: |
          set -o pipefail
          : "${EVENTBRITE_TOKEN:?EVENTBRITE_TOKEN secret missing}"
          : "${EB_IDS:?eventbrite_ids input missing — supply harvested EVENT ids}"
          python -m worker.importers.run_eventbrite_import --event-ids "$EB_IDS" --kind event --dry-run
      - name: Eventbrite dry-run (fetch + normalize + summarize, NO DB write)
        if: ${{ github.event.inputs.provider == 'eventbrite' }}
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EB_IDS: ${{ github.event.inputs.eventbrite_ids }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '2' }}
        run: |
          : "${EVENTBRITE_TOKEN:?EVENTBRITE_TOKEN secret missing — add it in repo Settings → Secrets → Actions}"
          : "${EB_IDS:?eventbrite_ids input missing — Eventbrite has no public search; supply curated organization ids}"
          : "${MAX_PAGES:?max_pages missing — the fetch bound is required}"
          python -m worker.importers.run_eventbrite_import --org-ids "$EB_IDS" --max-pages "$MAX_PAGES" --dry-run
